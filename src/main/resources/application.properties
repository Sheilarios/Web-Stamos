# ==========================================
# SPRING BOOT CONFIGURATION
# ==========================================
server.port=8080
server.servlet.context-path=/
server.error.path=/error
server.error.whitelabel.enabled=false

# ==========================================
# THYMELEAF TEMPLATE CONFIGURATION
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ==========================================
# STATIC RESOURCES
# ==========================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cached=false
spring.mvc.static-path-pattern=/static/**

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/stamos_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FILE UPLOADS
# ==========================================
app.upload.internal-dir=src/main/resources/internal.assets.uploads.proyectos.comprobantes/
app.upload.external-dir=${user.home}/stamos-uploads/comprobantes/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ==========================================
# EMAIL CONFIGURATION (DESACTIVADA - Solo logging)
# ==========================================
# No se configura ning\u00fan servidor SMTP real
# Los correos solo se mostrar\u00e1n en la consola
stamos.mail.from=noreply@stamos.com
stamos.app.url=http://localhost:8080

# ==========================================
# APPLICATION SPECIFIC
# ==========================================
app.name=Stamos Sistema de Gesti\u00f3n
app.version=1.0.0
app.admin.email=admin@stamos.com
app.payment.verification-hours=24

# ==========================================
# LOGGING
# ==========================================
logging.level.com.stamos=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/stamos-app.log
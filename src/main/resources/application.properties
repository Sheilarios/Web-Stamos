# ==========================================
# SPRING BOOT CONFIGURATION
# ==========================================
server.port=8080
server.servlet.context-path=/
server.error.path=/error
server.error.whitelabel.enabled=false
server.tomcat.uri-encoding=UTF-8

# ==========================================
# THYMELEAF TEMPLATE CONFIGURATION
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ==========================================
# STATIC RESOURCES - CONFIGURACI\u00d3N COMPLETA
# ==========================================
# Recursos est\u00e1ticos del proyecto (CSS, JS, im\u00e1genes)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.web.resources.cache.period=0
spring.web.resources.chain.cached=false
spring.mvc.static-path-pattern=/**

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/stamos_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==========================================
# FILE UPLOADS - CONFIGURACI\u00d3N COMPLETA
# ==========================================
# Directorio para archivos subidos (renders, planos, bocetos, comprobantes)
app.upload.dir=./uploads/

# Subdirectorios espec\u00edficos
app.upload.documentos.dir=./uploads/documentos/
app.upload.comprobantes.dir=./uploads/comprobantes/
app.upload.galeria.dir=./uploads/galeria/

# Configuraci\u00f3n de multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=./uploads/temp
spring.servlet.multipart.file-size-threshold=2KB

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
# Configuraci\u00f3n para env\u00edo de correos (recuperaci\u00f3n de contrase\u00f1a, notificaciones)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=stamos@email.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email de origen
stamos.mail.from=noreply@stamos.com
stamos.mail.admin=admin@stamos.com
stamos.app.url=http://localhost:8080

# ==========================================
# SECURITY CONFIGURATION
# ==========================================
# Configuraci\u00f3n de seguridad y sesiones
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Sesiones
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=30m
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=COOKIE

# ==========================================
# APPLICATION SPECIFIC
# ==========================================
app.name=STAMOS Sistema de Gesti\u00f3n
app.version=1.0.0
app.admin.email=admin@stamos.com

# Configuraciones de negocio
app.payment.verification-hours=24
app.project.default-payment-days=30
app.igv.default-rate=18.00
app.currency.default=PEN

# ==========================================
# JSON SERIALIZATION
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

# ==========================================
# LOGGING - CONFIGURACI\u00d3N COMPLETA
# ==========================================
# Niveles de logging
logging.level.com.stamos=DEBUG
logging.level.com.stamos.config=DEBUG
logging.level.com.stamos.service=DEBUG
logging.level.com.stamos.controller=DEBUG
logging.level.com.stamos.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Patrones de logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Archivos de logging
logging.file.name=logs/stamos-app.log
logging.file.path=./logs/
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-file-size=10MB

# ==========================================
# DEV TOOLS (Solo para desarrollo)
# ==========================================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**

# ==========================================
# ACTUATOR (Monitoreo)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.build.enabled=true
management.info.env.enabled=true

# ==========================================
# TOMCAT CONFIGURACI\u00d3N ADICIONAL
# ==========================================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.max-http-form-post-size=10MB
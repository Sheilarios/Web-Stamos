# ===================================
# STAMOS - Sistema de Gesti\u00f3n Empresarial
# ===================================

# --- Configuraci\u00f3n de la aplicaci\u00f3n ---
spring.application.name=STAMOS
server.port=8080

# --- Configuraci\u00f3n de Base de Datos (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/stamos_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA e Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf (vistas) ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Seguridad (Spring Security) ---
server.servlet.session.timeout=30m
spring.security.password.encoder.bcrypt.strength=10

# --- Env\u00edo de correos (ejemplo con Gmail) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=stamos@stamosl.com
spring.mail.password=tu_contrase\u00f1a_de_aplicacion
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Correo remitente
stamos.mail.from=no-reply@stamosl.com

# --- URL base de la aplicaci\u00f3n (para enlaces en correos) ---
stamos.app.url=http://localhost:8080

# --- Configuraci\u00f3n de IGV por defecto ---
stamos.igv.default=18.0

# --- Rutas de almacenamiento de archivos (uploads) ---
stamos.uploads.path=uploads/
stamos.uploads.comprobantes=uploads/comprobantes/
stamos.uploads.proyectos=uploads/proyectos/

# --- L\u00edmites de tama\u00f1o de archivos subidos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Configuraci\u00f3n de logs de auditor\u00eda ---
logging.level.com.stamos=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/stamos-audit.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n

# --- Modo de pagos (manual por defecto) ---
stamos.payment.gateway.implementation=manual

# --- Configuraci\u00f3n espec\u00edfica del portal de cliente ---
stamos.pago.verificacion.horas=24

# --- Configuraci\u00f3n de reportes (rutas temporales para exportaci\u00f3n) ---
stamos.reportes.temp-dir=temp/reports/

# --- Configuraci\u00f3n adicional de Spring MVC ---
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# --- Configuraci\u00f3n de mensajes internacionalizaci\u00f3n (opcional) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
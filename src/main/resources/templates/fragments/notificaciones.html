<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones</title>
</head>
<body>

<!-- ===== FRAGMENTO: CAMPANITA DE NOTIFICACIONES ===== -->
<div th:fragment="campanita" class="notificaciones-wrapper">
    <a href="#" id="notificacionesBtn" class="notificacion-campana">
        <i class="ti ti-bell"></i>
        <span id="contadorNotificaciones"
              th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
              th:text="${notificacionesNoLeidas}"
              class="contador-notificaciones">0</span>
        <span th:unless="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
              class="contador-notificaciones vacio">0</span>
    </a>

    <div id="dropdownNotificaciones" class="dropdown-notificaciones">
        <div id="listaNotificaciones" style="padding: 0 8px;">
            <div style="text-align: center; padding: 20px; color: #8A8A8A; font-size: 13px;">
                <i class="ti ti-loader" style="font-size: 20px; display: block; margin-bottom: 8px;"></i>
                Cargando notificaciones...
            </div>
        </div>
        <div class="dropdown-footer">
            <a href="#" onclick="marcarTodasComoLeidas(event)">Marcar todas como leídas</a>
        </div>
    </div>
</div>

<!-- ===== ESTILOS ADICIONALES PARA LA CAMPANITA ===== -->
<style>
    .notificaciones-wrapper {
        position: relative;
        display: inline-block;
        margin-right: 16px;
    }
    .notificacion-campana {
        color: #FFFFFF;
        font-size: 24px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        transition: color 0.15s;
    }
    .notificacion-campana:hover {
        color: #F5C400 !important;
    }
    .contador-notificaciones {
        position: absolute;
        top: -6px;
        right: -10px;
        background: #EF4444;
        color: white;
        font-size: 10px;
        font-weight: 700;
        border-radius: 50%;
        padding: 2px 6px;
        min-width: 18px;
        text-align: center;
        line-height: 1.2;
        border: 2px solid #000000;
    }
    .contador-notificaciones.vacio {
        display: none;
    }

    .dropdown-notificaciones {
        display: none;
        position: absolute;
        top: 40px;
        right: 0;
        background: #FFFFFF;
        border: 1px solid #E8E8E8;
        border-radius: 12px;
        min-width: 320px;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        z-index: 1000;
        padding: 8px 0;
        max-height: 400px;
        overflow-y: auto;
    }
    .dropdown-notificaciones.abierto {
        display: block;
    }
    .dropdown-notificaciones::-webkit-scrollbar {
        width: 4px;
    }
    .dropdown-notificaciones::-webkit-scrollbar-thumb {
        background: #F5C400;
        border-radius: 4px;
    }

    .notificacion-item {
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 4px;
        transition: background 0.15s;
        cursor: pointer;
        border-bottom: 1px solid #F5F5F5;
    }
    .notificacion-item:hover {
        background: #F8F8F8;
    }
    .notificacion-item.no-leida {
        background: #FFFBE6;
        border-left: 3px solid #F5C400;
    }
    .notificacion-item .titulo {
        font-weight: 600;
        font-size: 13px;
        color: #1A1F2E;
    }
    .notificacion-item .mensaje {
        font-size: 12px;
        color: #6B6B6B;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .notificacion-item .fecha {
        font-size: 10px;
        color: #9BA5B7;
        margin-top: 4px;
    }
    .notificacion-item .tipo-badge {
        font-size: 9px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        background: #F0F0F0;
        color: #5A5A5A;
    }
    .notificacion-item .tipo-badge.PAGO { background: #EBF7F0; color: #1A7040; }
    .notificacion-item .tipo-badge.PROYECTO { background: #E8F0FE; color: #1A56DB; }
    .notificacion-item .tipo-badge.PLAZO { background: #FFF0EE; color: #C0392B; }
    .notificacion-item .tipo-badge.ALERTA { background: #FFFBE6; color: #9A7500; }
    .notificacion-item .tipo-badge.SISTEMA { background: #F5F6F8; color: #5A6478; }

    .dropdown-footer {
        border-top: 1px solid #E8E8E8;
        padding: 8px 12px;
        text-align: center;
    }
    .dropdown-footer a {
        color: #F5C400;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
    }
    .dropdown-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 768px) {
        .notificaciones-wrapper {
            margin-right: 8px;
        }
        .dropdown-notificaciones {
            min-width: 280px;
            max-width: 320px;
            right: -80px;
        }
    }

    @media (max-width: 480px) {
        .dropdown-notificaciones {
            min-width: 260px;
            max-width: 290px;
            right: -60px;
        }
    }
</style>

<!-- ===== SCRIPTS PARA NOTIFICACIONES ===== -->
<script th:inline="javascript">
    /*<![CDATA[*/
    var NOTIFICACIONES_CONFIG = {
        apiUrl: /*[[@{/api/notificaciones}]]*/ '/api/notificaciones',
        contadorUrl: /*[[@{/api/notificaciones/contador}]]*/ '/api/notificaciones/contador',
        marcarTodasUrl: /*[[@{/api/notificaciones/marcar-todas-leidas}]]*/ '/api/notificaciones/marcar-todas-leidas'
    };
    /*]]>*/

    document.addEventListener('DOMContentLoaded', function() {
        const btnNotificaciones = document.getElementById('notificacionesBtn');
        const dropdown = document.getElementById('dropdownNotificaciones');
        const lista = document.getElementById('listaNotificaciones');

        // Si no existe el botón, salir (puede que no esté en el DOM)
        if (!btnNotificaciones) return;

        btnNotificaciones.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            if (dropdown.classList.contains('abierto')) {
                dropdown.classList.remove('abierto');
                return;
            }

            dropdown.classList.add('abierto');
            cargarNotificaciones();
        });

        document.addEventListener('click', function(e) {
            if (dropdown && dropdown.classList.contains('abierto')) {
                if (!dropdown.contains(e.target) && e.target !== btnNotificaciones && !btnNotificaciones.contains(e.target)) {
                    dropdown.classList.remove('abierto');
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && dropdown && dropdown.classList.contains('abierto')) {
                dropdown.classList.remove('abierto');
            }
        });

        function cargarNotificaciones() {
            if (!lista) return;

            lista.innerHTML = '<div style="text-align: center; padding: 20px; color: #8A8A8A; font-size: 13px;">' +
                              '<i class="ti ti-loader" style="font-size: 20px; display: block; margin-bottom: 8px;"></i>' +
                              'Cargando notificaciones...</div>';

            fetch(NOTIFICACIONES_CONFIG.apiUrl + '/ultimas')
                .then(response => {
                    if (!response.ok) throw new Error('Error al cargar notificaciones');
                    return response.json();
                })
                .then(data => {
                    if (!data || data.length === 0) {
                        lista.innerHTML = '<div style="text-align: center; padding: 20px; color: #8A8A8A; font-size: 13px;">' +
                                          '<i class="ti ti-bell-off" style="font-size: 24px; display: block; margin-bottom: 8px;"></i>' +
                                          'No tienes notificaciones</div>';
                        return;
                    }

                    let html = '';
                    data.forEach(notif => {
                        const leidaClass = notif.leida ? '' : 'no-leida';
                        const tipoBadge = notif.tipo || 'SISTEMA';
                        const fecha = new Date(notif.fechaCreacion);
                        const fechaStr = fecha.toLocaleDateString('es-PE', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        html += `<div class="notificacion-item ${leidaClass}" data-id="${notif.idNotificacion}" onclick="irANotificacion('${notif.urlDestino || '#'}')">
                                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                        <span class="titulo">${notif.titulo || 'Notificación'}</span>
                                        <span class="tipo-badge ${tipoBadge}">${tipoBadge}</span>
                                    </div>
                                    <div class="mensaje">${notif.mensaje || ''}</div>
                                    <div class="fecha">${fechaStr}</div>
                                </div>`;
                    });
                    lista.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error cargando notificaciones:', error);
                    lista.innerHTML = '<div style="text-align: center; padding: 20px; color: #EF4444; font-size: 13px;">' +
                                      '<i class="ti ti-alert-circle" style="font-size: 20px; display: block; margin-bottom: 8px;"></i>' +
                                      'Error al cargar notificaciones</div>';
                });
        }

        window.marcarTodasComoLeidas = function(event) {
            if (event) event.preventDefault();

            fetch(NOTIFICACIONES_CONFIG.marcarTodasUrl, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const contador = document.getElementById('contadorNotificaciones');
                        if (contador) {
                            contador.textContent = '0';
                            contador.classList.add('vacio');
                        }
                        cargarNotificaciones();
                    }
                })
                .catch(error => console.error('Error:', error));
        };

        window.irANotificacion = function(url) {
            if (url && url !== '#') {
                window.location.href = url;
            }
            if (dropdown) dropdown.classList.remove('abierto');
        };

        // Actualizar contador cada 60 segundos
        setInterval(function() {
            fetch(NOTIFICACIONES_CONFIG.contadorUrl)
                .then(response => response.json())
                .then(data => {
                    const contador = document.getElementById('contadorNotificaciones');
                    if (contador) {
                        const total = data.total || 0;
                        if (total > 0) {
                            contador.textContent = total;
                            contador.classList.remove('vacio');
                        } else {
                            contador.textContent = '0';
                            contador.classList.add('vacio');
                        }
                    }
                })
                .catch(() => {});
        }, 60000);
    });
</script>

</body>
</html>

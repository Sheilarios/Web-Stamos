<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularios · STAMOS</title>
</head>
<body>

<!-- ============================================================ -->
<!-- FRAGMENT: formulario_cliente                                 -->
<!-- ============================================================ -->
<div th:fragment="formulario_cliente">
    <div class="form-group">
        <label class="form-label">Tipo de persona</label>
        <select name="tipoPersona" class="form-control" required>
            <option value="Natural">Persona Natural</option>
            <option value="Juridica">Persona Jurídica</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Nombre / Razón social <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-user"></i>
            <input type="text" name="nombreRazonSocial" class="form-control" placeholder="Ej: Juan Pérez o STAMOS S.R.L." required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label class="form-label">RUC (opcional)</label>
            <div class="input-wrap">
                <i class="ti ti-id"></i>
                <input type="text" name="ruc" class="form-control" placeholder="20549500715" maxlength="11">
            </div>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Teléfono <span class="req">*</span></label>
            <div class="input-wrap">
                <i class="ti ti-phone"></i>
                <input type="tel" name="telefono" class="form-control" placeholder="987 000 000" required>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Correo electrónico <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-mail"></i>
            <input type="email" name="email" class="form-control" placeholder="cliente@empresa.com" required>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Dirección</label>
        <div class="input-wrap">
            <i class="ti ti-map-pin"></i>
            <input type="text" name="direccion" class="form-control" placeholder="Jr. Antisuyo 438, Zárate — SJL">
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- FRAGMENT: formulario_cotizacion                              -->
<!-- ============================================================ -->
<div th:fragment="formulario_cotizacion">
    <div class="form-group">
        <label class="form-label">Cliente <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-user"></i>
            <select name="idCliente" class="form-control" required>
                <option value="">Seleccionar cliente...</option>
                <option th:each="cliente : ${clientes}" th:value="${cliente.idCliente}" th:text="${cliente.nombreRazonSocial}">Cliente</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Fecha de validez</label>
        <div class="input-wrap">
            <i class="ti ti-calendar"></i>
            <input type="date" name="fechaValidez" class="form-control">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Observaciones</label>
        <div class="input-wrap textarea-wrap">
            <i class="ti ti-message"></i>
            <textarea name="observaciones" class="form-control" rows="3" placeholder="Notas adicionales sobre la cotización..."></textarea>
        </div>
    </div>

    <!-- Productos / Servicios -->
    <div class="form-group">
        <label class="form-label">Productos / Servicios <span class="req">*</span></label>
        <div id="productosContainer" class="productos-container">
            <div class="producto-row" style="display:grid; grid-template-columns:2fr 80px 100px 80px 40px; gap:10px; align-items:end; margin-bottom:10px;">
                <div class="input-wrap">
                    <i class="ti ti-box" style="left:10px;"></i>
                    <select name="idProducto" class="form-control" style="padding-left:36px;" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="producto : ${productos}" th:value="${producto.idProducto}" th:text="${producto.nombreItem}">Producto</option>
                    </select>
                </div>
                <input type="number" name="cantidad" class="form-control" placeholder="Cant." value="1" min="1" style="padding-left:12px;">
                <input type="number" name="precioUnitario" class="form-control" placeholder="Precio" step="0.01" style="padding-left:12px;">
                <input type="number" name="descuento" class="form-control" placeholder="Desc." step="0.01" value="0" style="padding-left:12px;">
                <button type="button" class="btn-remove-producto" style="background:#EF4444; color:white; border:none; border-radius:8px; height:40px; cursor:pointer; width:40px; display:flex; align-items:center; justify-content:center;">
                    <i class="ti ti-x" style="font-size:16px;"></i>
                </button>
            </div>
        </div>
        <button type="button" onclick="agregarProducto()" class="btn-add-producto" style="background:#000000; color:#FFFFFF; border:none; padding:8px 16px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
            <i class="ti ti-plus"></i> Agregar producto
        </button>
    </div>

    <script>
        function agregarProducto() {
            const container = document.getElementById('productosContainer');
            const row = container.querySelector('.producto-row').cloneNode(true);
            row.querySelectorAll('input, select').forEach(el => el.value = '');
            row.querySelector('input[name="cantidad"]').value = 1;
            row.querySelector('input[name="descuento"]').value = 0;
            container.appendChild(row);
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('.btn-remove-producto')) {
                const container = document.getElementById('productosContainer');
                if (container.querySelectorAll('.producto-row').length > 1) {
                    e.target.closest('.producto-row').remove();
                }
            }
        });
    </script>
</div>

<!-- ============================================================ -->
<!-- FRAGMENT: formulario_proyecto                                -->
<!-- ============================================================ -->
<div th:fragment="formulario_proyecto">
    <div class="form-group">
        <label class="form-label">Nombre del proyecto <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-folder"></i>
            <input type="text" name="nombreProyecto" class="form-control" placeholder="Proyecto - COT-00001" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label class="form-label">Fecha de inicio</label>
            <div class="input-wrap">
                <i class="ti ti-calendar"></i>
                <input type="date" name="fechaInicio" class="form-control">
            </div>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Fecha fin estimada</label>
            <div class="input-wrap">
                <i class="ti ti-calendar"></i>
                <input type="date" name="fechaFinEstimada" class="form-control">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Estado actual</label>
        <div class="input-wrap">
            <i class="ti ti-arrows-exchange"></i>
            <select name="idEstadoActual" class="form-control">
                <option th:each="estado : ${estados}" th:value="${estado.idEstado}" th:text="${estado.nombreEstado}">Estado</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Monto total</label>
        <div class="input-wrap">
            <i class="ti ti-currency-dollar"></i>
            <input type="number" name="montoTotal" class="form-control" placeholder="0.00" step="0.01" min="0">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Observaciones</label>
        <div class="input-wrap textarea-wrap">
            <i class="ti ti-message"></i>
            <textarea name="observaciones" class="form-control" rows="3" placeholder="Notas sobre el proyecto..."></textarea>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- FRAGMENT: formulario_pago                                    -->
<!-- ============================================================ -->
<div th:fragment="formulario_pago">
    <div class="form-group">
        <label class="form-label">Proyecto <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-folder"></i>
            <select name="idProyecto" class="form-control" required>
                <option value="">Seleccionar proyecto...</option>
                <option th:each="proyecto : ${proyectos}" th:value="${proyecto.idProyecto}" th:text="${proyecto.nombreProyecto}">Proyecto</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label class="form-label">Monto <span class="req">*</span></label>
            <div class="input-wrap">
                <i class="ti ti-currency-dollar"></i>
                <input type="number" name="monto" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
            </div>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Método de pago <span class="req">*</span></label>
            <div class="input-wrap">
                <i class="ti ti-credit-card"></i>
                <select name="metodoPago" class="form-control" required>
                    <option value="">Seleccionar...</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Cheque">Cheque</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Tipo de comprobante</label>
        <div class="input-wrap">
            <i class="ti ti-file"></i>
            <select name="tipoComprobante" class="form-control">
                <option value="Boleta">Boleta</option>
                <option value="Factura">Factura</option>
                <option value="Ticket">Ticket</option>
                <option value="Otro">Otro</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Número de comprobante</label>
        <div class="input-wrap">
            <i class="ti ti-hash"></i>
            <input type="text" name="numeroComprobante" class="form-control" placeholder="B001-00012345">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Comprobante (archivo)</label>
        <div class="input-wrap" style="display:flex; align-items:center; border:1px solid #E0E0E0; border-radius:10px; padding:8px 12px; gap:12px;">
            <i class="ti ti-upload" style="color:#6B6B6B;"></i>
            <input type="file" name="comprobante" class="form-control" style="border:none; padding:0; background:transparent;" accept=".jpg,.jpeg,.png,.gif,.pdf">
        </div>
        <div style="font-size:11px; color:#8A8A8A; margin-top:4px;">
            <i class="ti ti-info-circle"></i> Formatos: JPG, PNG, GIF, PDF (máx. 5MB)
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- FRAGMENT: formulario_inventario                              -->
<!-- ============================================================ -->
<div th:fragment="formulario_inventario">
    <div class="form-group">
        <label class="form-label">Producto <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-box"></i>
            <select name="idProducto" class="form-control" required>
                <option value="">Seleccionar producto...</option>
                <option th:each="producto : ${productos}" th:value="${producto.idProducto}" th:text="${producto.nombreItem}">Producto</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Código serial <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-barcode"></i>
            <input type="text" name="codigoSerial" class="form-control" placeholder="SN-2026-0001" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label class="form-label">Ubicación</label>
            <div class="input-wrap">
                <i class="ti ti-map-pin"></i>
                <input type="text" name="ubicacion" class="form-control" placeholder="Almacén A - Estante 3">
            </div>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Estado físico</label>
            <div class="input-wrap">
                <i class="ti ti-circle-check"></i>
                <select name="estadoFisico" class="form-control">
                    <option value="Disponible">Disponible</option>
                    <option value="En uso">En uso</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                    <option value="Dañado">Dañado</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label class="form-label">Fecha de adquisición</label>
            <div class="input-wrap">
                <i class="ti ti-calendar"></i>
                <input type="date" name="fechaAdquisicion" class="form-control">
            </div>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Valor de compra</label>
            <div class="input-wrap">
                <i class="ti ti-currency-dollar"></i>
                <input type="number" name="valorCompra" class="form-control" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Observaciones</label>
        <div class="input-wrap textarea-wrap">
            <i class="ti ti-message"></i>
            <textarea name="observaciones" class="form-control" rows="2" placeholder="Notas sobre el equipo..."></textarea>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- FRAGMENT: formulario_reserva                                 -->
<!-- ============================================================ -->
<div th:fragment="formulario_reserva">
    <div class="form-group">
        <label class="form-label">Equipo / Inventario <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-device-tv"></i>
            <select name="idInventario" class="form-control" required>
                <option value="">Seleccionar equipo...</option>
                <option th:each="equipo : ${equipos}" th:value="${equipo.idInventario}" th:text="${equipo.nombreProducto} + ' (' + ${equipo.codigoSerial} + ')'">Equipo</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Proyecto <span class="req">*</span></label>
        <div class="input-wrap">
            <i class="ti ti-folder"></i>
            <select name="idProyecto" class="form-control" required>
                <option value="">Seleccionar proyecto...</option>
                <option th:each="proyecto : ${proyectos}" th:value="${proyecto.idProyecto}" th:text="${proyecto.nombreProyecto}">Proyecto</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label class="form-label">Fecha de inicio <span class="req">*</span></label>
            <div class="input-wrap">
                <i class="ti ti-calendar"></i>
                <input type="date" name="fechaInicio" class="form-control" required>
            </div>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Fecha de fin <span class="req">*</span></label>
            <div class="input-wrap">
                <i class="ti ti-calendar"></i>
                <input type="date" name="fechaFin" class="form-control" required>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Notas</label>
        <div class="input-wrap textarea-wrap">
            <i class="ti ti-message"></i>
            <textarea name="notas" class="form-control" rows="2" placeholder="Detalles adicionales sobre la reserva..."></textarea>
        </div>
    </div>

    <div style="background:#FFFBE6; border:1px solid #E0C84A; border-radius:10px; padding:12px 16px; font-size:12px; color:#8A6500; display:flex; align-items:center; gap:10px; margin-top:12px;">
        <i class="ti ti-info-circle" style="font-size:16px; color:#F5C400;"></i>
        <span>El equipo debe estar disponible en el rango de fechas seleccionado.</span>
    </div>
</div>

<!-- ============================================================ -->
<!-- ESTILOS COMUNES PARA FORMULARIOS                            -->
<!-- ============================================================ -->
<style>
    /* Estilos base para formularios */
    .form-group {
        margin-bottom: 18px;
    }
    .form-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #3A3A3A;
        margin-bottom: 6px;
    }
    .form-label .req {
        color: #F5C400;
    }
    .input-wrap {
        position: relative;
    }
    .input-wrap i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #9A9A9A;
        font-size: 16px;
    }
    .input-wrap.textarea-wrap i {
        top: 16px;
        transform: none;
    }
    .form-control {
        width: 100%;
        padding: 12px 12px 12px 44px;
        border: 1px solid #E0E0E0;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.2s;
        background: #FFFFFF;
        outline: none;
        font-family: inherit;
        color: #1A1F2E;
    }
    .form-control:focus {
        border-color: #F5C400;
        box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
    }
    .form-control::placeholder {
        color: #B0B0B0;
        font-size: 13px;
    }
    .form-control:disabled {
        background: #F5F5F5;
        cursor: not-allowed;
    }
    select.form-control {
        appearance: none;
        cursor: pointer;
    }
    textarea.form-control {
        resize: vertical;
        min-height: 80px;
        padding-top: 12px;
    }

    .form-row {
        display: flex;
        gap: 16px;
    }

    .form-row .form-group {
        flex: 1;
    }

    /* Estilos para el contenedor de productos en cotización */
    .productos-container {
        margin-bottom: 10px;
    }
    .producto-row {
        display: grid;
        grid-template-columns: 2fr 80px 100px 80px 40px;
        gap: 10px;
        align-items: end;
        margin-bottom: 10px;
    }
    .producto-row .form-control {
        padding-left: 36px;
    }
    .producto-row .input-wrap i {
        left: 10px;
        font-size: 14px;
    }

    @media (max-width: 700px) {
        .form-row {
            flex-direction: column;
        }
        .producto-row {
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .producto-row .input-wrap i {
            left: 14px;
        }
        .btn-remove-producto {
            width: 100% !important;
            height: 40px !important;
        }
    }
</style>

</body>
</html>

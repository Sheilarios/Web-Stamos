<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sidebar Admin</title>
</head>
<body>
    <aside th:fragment="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <h2>STAMOS<span>.</span></h2>
            <small>Administración</small>
        </div>

        <ul class="sidebar-menu">
            <li th:each="item : ${menuItems}">
                <a th:href="${item.url}" 
                   th:classappend="${#strings.equalsIgnoreCase(currentPath, item.url)} ? 'active' : ''">
                    <i th:class="${item.icon}"></i>
                    <span th:text="${item.label}"></span>
                </a>
            </li>

            <li>
                <a th:href="@{/notificaciones}" 
                   th:classappend="${#strings.equalsIgnoreCase(currentPath, '/notificaciones')} ? 'active' : ''">
                    <i class="ti ti-bell"></i>
                    <span>Notificaciones</span>
                    <!-- Badge de no leídas -->
                    <span th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
                          class="badge-notificacion"
                          th:text="${notificacionesNoLeidas}"></span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <i class="ti ti-logout"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <style>
        .sidebar {
            width: 260px;
            background: #000000;
            padding: 32px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            border-right: none;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #F5C400; border-radius: 4px; }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .sidebar-brand h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .sidebar-brand h2 span { color: #F5C400; }

        .sidebar-brand small {
            display: block;
            font-size: 11px;
            color: #8A8A8A;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-menu li { margin-bottom: 2px; }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: #C0C0C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
            position: relative;
        }

        .sidebar-menu li a i {
            font-size: 18px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-menu li a:hover {
            background: rgba(245, 196, 0, 0.10);
            color: #FFFFFF;
        }

        .sidebar-menu li a.active {
            background: #F5C400;
            color: #000000;
            font-weight: 600;
        }

        .sidebar-menu li a.active i { color: #000000; }

        .badge-notificacion {
            background: #EF4444;
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
            min-width: 20px;
            text-align: center;
            line-height: 1.4;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #EF4444;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .sidebar-footer a:hover {
            background: rgba(239, 68, 68, 0.10);
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 72px;
                padding: 16px 0;
            }

            .sidebar-brand h2, 
            .sidebar-brand small, 
            .sidebar-menu li a span {
                display: none;
            }

            .sidebar-menu li a {
                justify-content: center;
                padding: 12px;
            }

            .sidebar-menu li a i {
                font-size: 22px;
                width: auto;
            }

            .badge-notificacion {
                position: absolute;
                top: -4px;
                right: -4px;
                font-size: 8px;
                padding: 1px 5px;
                min-width: 14px;
            }

            .sidebar-footer a span {
                display: none;
            }

            .sidebar-footer a {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid #222;
                flex-wrap: wrap;
            }

            .sidebar-brand {
                padding: 0;
                border-bottom: none;
                margin-bottom: 0;
                flex: 1;
            }

            .sidebar-brand h2 {
                font-size: 20px;
            }

            .sidebar-brand small {
                display: block;
                font-size: 10px;
            }

            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0;
                flex: 1;
            }

            .sidebar-menu li {
                margin-bottom: 0;
            }

            .sidebar-menu li a {
                padding: 6px 10px;
                font-size: 12px;
            }

            .sidebar-menu li a i {
                font-size: 16px;
            }

            .sidebar-menu li a span {
                display: inline;
                font-size: 11px;
            }

            .badge-notificacion {
                font-size: 9px;
                padding: 1px 6px;
                min-width: 16px;
                position: static;
                margin-left: 4px;
            }

            .sidebar-footer {
                border-top: none;
                padding: 0;
                margin: 0;
            }

            .sidebar-footer a span {
                display: inline;
                font-size: 11px;
            }

            .sidebar-footer a {
                padding: 6px 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .sidebar-menu li a span {
                display: none;
            }

            .sidebar-menu li a i {
                font-size: 18px;
            }

            .badge-notificacion {
                font-size: 8px;
                padding: 1px 5px;
                min-width: 14px;
            }
        }
    </style>
</body>
</html>

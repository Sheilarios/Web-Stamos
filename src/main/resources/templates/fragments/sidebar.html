<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sidebar</title>
</head>
<body>

<aside th:fragment="sidebar_admin" class="sidebar">
    <div class="sidebar-brand">
        <h2>STAMOS<span>.</span></h2>
        <small>Administracion</small>
    </div>

    <ul class="sidebar-menu">
        <li th:each="item : ${menuItems}">
            <a th:href="${item.url}" 
               th:classappend="${#strings.startsWith(currentPath, item.url)} ? 'active' : ''">
                <i th:class="${item.icon}"></i>
                <span th:text="${item.label}"></span>
                <span th:if="${item.label == 'Notificaciones' and notificacionesNoLeidas > 0}" 
                      style="background:#EF4444; color:white; font-size:10px; padding:2px 8px; border-radius:10px; margin-left:auto;"
                      th:text="${notificacionesNoLeidas}"></span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <a th:href="@{/logout}">
            <i class="ti ti-logout"></i>
            <span>Cerrar Sesion</span>
        </a>
    </div>
</aside>

</body>
</html>

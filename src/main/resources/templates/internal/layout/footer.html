<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Footer fragment -->
<div th:fragment="footer" class="footer mt-auto py-3 bg-white border-top">
    <div class="container-fluid">
        <div class="row">
            <div class="col text-center text-muted small">
                © <span th:text="${#temporals.format(#dates.createNow(), 'yyyy')}"></span> STAMOS - Sistema de Gestión Empresarial.
                Todos los derechos reservados.
            </div>
        </div>
    </div>
</div>

<!-- Flash messages fragment -->
<div th:fragment="flash-messages">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="ti ti-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="ti ti-alert-circle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="ti ti-alert-triangle"></i> <span th:text="${warning}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Scripts adicionales fragment -->
<div th:fragment="scripts-extra">
    <!-- Aquí se pueden agregar scripts específicos por página -->
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>STAMOS - Sistema de Gestión</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables + Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/v/dt/dt-2.0.2/datatables.min.css" rel="stylesheet">
    <!-- Estilos personalizados del sistema (cargar después de Bootstrap) -->
    <link th:href="@{/internal/css/sidebar.css}" rel="stylesheet">
    <link th:href="@{/internal/css/custom.css}" rel="stylesheet">
    <link th:href="@{/internal/css/responsive.css}" rel="stylesheet">
    <!-- Si se usa un archivo internal.css que agrupe todos, descomentar:
    <link th:href="@{/internal/css/internal.css}" rel="stylesheet">
    -->
</head>

<div th:fragment="topbar">
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="btn btn-dark d-lg-none" type="button" id="menuToggle">
                <i class="bi bi-list"></i>
            </button>
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/logo-stamos.png}" alt="STAMOS" height="35" class="d-inline-block align-top">
                STAMOS
            </a>
            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" type="button" id="userMenu" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle"></i> <span th:text="${#authentication.name}"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/internal/usuarios/perfil}"><i class="bi bi-person"></i> Mi perfil</a></li>
                    <li><a class="dropdown-item" th:href="@{/cambiar-contraseña}"><i class="bi bi-key"></i> Cambiar contraseña</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Espaciador para compensar navbar fixed -->
    <div style="height: 60px;"></div>
    <!-- Contenedor global para alertas flash / mensajes -->
    <div id="alertContainer" class="container mt-2"></div>
</div>

<!-- Scripts comunes que deben incluirse en el head o al inicio del body -->
<div th:fragment="scripts-top">
    <!-- jQuery (requerido por DataTables) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables core + integración Bootstrap 5 -->
    <script src="https://cdn.datatables.net/2.0.2/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.2/js/dataTables.bootstrap5.min.js"></script>
    <!-- Interceptor AJAX global y date-helpers (opcionales pero recomendados) -->
    <script th:src="@{/internal/js/ajax-interceptor.js}"></script>
    <script th:src="@{/internal/js/date-helpers.js}"></script>
</div>
</html>

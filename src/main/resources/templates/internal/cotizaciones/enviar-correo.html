<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3>Enviar cotización por correo</h3>
                </div>
                <div class="card-body">
                    <p>Se enviará la cotización <strong>#<span th:text="${cotizacion.id}"></span></strong> al correo del cliente:</p>
                    <p><strong>Cliente:</strong> <span th:text="${cotizacion.cliente.nombreRazonSocial}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${cotizacion.cliente.email}"></span></p>
                    <p><strong>Monto total:</strong> S/ <span th:text="${#numbers.formatDecimal(cotizacion.total, 1, 2)}"></span></p>
                    <form th:action="@{/internal/cotizaciones/enviar-correo/{id}(id=${cotizacion.id})}" method="post">
                        <button type="submit" class="btn btn-primary">Enviar ahora</button>
                        <a th:href="@{/internal/cotizaciones/detalle/{id}(id=${cotizacion.id})}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
</body>
</html>

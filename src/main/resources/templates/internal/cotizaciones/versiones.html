<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Versiones de cotización</h1>
                <a th:href="@{/internal/cotizaciones/detalle/{id}(id=${cotizacion.id})}" class="btn btn-secondary">Volver a cotización</a>
            </div>
            <div class="card">
                <div class="card-header">
                    <h4>Cotización original #<span th:text="${cotizacion.id}"></span> (versión <span th:text="${cotizacion.version}"></span>)</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Versión</th>
                                    <th>Fecha emisión</th>
                                    <th>Subtotal</th>
                                    <th>IGV</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td th:text="${cotizacion.version}"></td>
                                    <td th:text="${#dates.format(cotizacion.fechaEmision, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${#numbers.formatDecimal(cotizacion.subtotal, 1, 2)}"></td>
                                    <td th:text="${#numbers.formatDecimal(cotizacion.igv, 1, 2)}"></td>
                                    <td th:text="${#numbers.formatDecimal(cotizacion.total, 1, 2)}"></td>
                                    <td><span class="badge" th:classappend="${cotizacion.estado == 'APROBADA' ? 'bg-success' : (cotizacion.estado == 'RECHAZADA' ? 'bg-danger' : (cotizacion.estado == 'ANULADA' ? 'bg-secondary' : 'bg-warning'))}" th:text="${cotizacion.estado}"></span></td>
                                    <td><a th:href="@{/internal/cotizaciones/detalle/{id}(id=${cotizacion.id})}" class="btn btn-sm btn-info">Ver</a></td>
                                </tr>
                                <tr th:each="ver : ${versiones}">
                                    <td th:text="${ver.version}"></td>
                                    <td th:text="${#dates.format(ver.fechaEmision, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${#numbers.formatDecimal(ver.subtotal, 1, 2)}"></td>
                                    <td th:text="${#numbers.formatDecimal(ver.igv, 1, 2)}"></td>
                                    <td th:text="${#numbers.formatDecimal(ver.total, 1, 2)}"></td>
                                    <td><span class="badge" th:classappend="${ver.estado == 'APROBADA' ? 'bg-success' : (ver.estado == 'RECHAZADA' ? 'bg-danger' : (ver.estado == 'ANULADA' ? 'bg-secondary' : 'bg-warning'))}" th:text="${ver.estado}"></span></td>
                                    <td><a th:href="@{/internal/cotizaciones/detalle/{id}(id=${ver.id})}" class="btn btn-sm btn-info">Ver</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
</body>
</html>

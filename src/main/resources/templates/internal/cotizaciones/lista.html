<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Cotizaciones</h1>
                <a th:href="@{/internal/cotizaciones/nueva}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nueva cotización
                </a>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label>Filtrar por estado</label>
                            <select id="filtroEstado" class="form-select">
                                <option value="">Todos</option>
                                <option value="EMITIDA">Emitida</option>
                                <option value="APROBADA">Aprobada</option>
                                <option value="RECHAZADA">Rechazada</option>
                                <option value="ANULADA">Anulada</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Filtrar por cliente</label>
                            <select id="filtroCliente" class="form-select">
                                <option value="">Todos los clientes</option>
                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreRazonSocial}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table id="tablaCotizaciones" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Fecha emisión</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Versión</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cot : ${cotizaciones}">
                                    <td th:text="${cot.id}"></td>
                                    <td th:text="${cot.cliente.nombreRazonSocial}"></td>
                                    <td th:text="${#dates.format(cot.fechaEmision, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${'S/ ' + #numbers.formatDecimal(cot.total, 1, 2)}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${cot.estado == 'APROBADA' ? 'bg-success' : (cot.estado == 'RECHAZADA' ? 'bg-danger' : (cot.estado == 'ANULADA' ? 'bg-secondary' : 'bg-warning'))}" th:text="${cot.estado}"></span>
                                    </td>
                                    <td th:text="${cot.version}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/internal/cotizaciones/detalle/{id}(id=${cot.id})}" class="btn btn-sm btn-info" title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/internal/cotizaciones/editar/{id}(id=${cot.id})}" class="btn btn-sm btn-warning" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/internal/cotizaciones/enviar-correo/{id}(id=${cot.id})}" class="btn btn-sm btn-secondary" title="Enviar por correo">
                                                <i class="bi bi-envelope"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/cotizaciones.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 th:if="${action == 'crear'}">Nueva cotización</h3>
                    <h3 th:if="${action == 'editar'}">Editar cotización (versión <span th:text="${versionAnterior}+1"></span>)</h3>
                </div>
                <div class="card-body">
                    <form id="formCotizacion" th:action="@{${action == 'crear'} ? '/internal/cotizaciones/guardar' : '/internal/cotizaciones/actualizar/' + cotizacion.id}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="clienteNombre" class="form-label">Cliente *</label>
                                <input type="text" id="clienteNombre" class="form-control" placeholder="Buscar cliente..." autocomplete="off">
                                <input type="hidden" id="clienteId" name="cliente.id" th:value="${cotizacion.cliente.id}" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="fechaEmision" class="form-label">Fecha emisión *</label>
                                <input type="date" id="fechaEmision" name="fechaEmision" class="form-control" th:value="${cotizacion.fechaEmision}" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="validezDias" class="form-label">Validez (días) *</label>
                                <input type="number" id="validezDias" name="validezDias" class="form-control" th:value="${cotizacion.validezDias}" required>
                            </div>
                        </div>
                        <div class="card mt-3">
                            <div class="card-header">
                                <h4>Ítems de la cotización</h4>
                            </div>
                            <div class="card-body">
                                <div class="row g-2 align-items-end mb-3">
                                    <div class="col-md-4">
                                        <label>Producto / Servicio</label>
                                        <input type="text" id="productoNombre" class="form-control" placeholder="Buscar producto...">
                                        <input type="hidden" id="productoId">
                                    </div>
                                    <div class="col-md-3">
                                        <label>Concepto (personalizado)</label>
                                        <input type="text" id="concepto" class="form-control" placeholder="Descripción">
                                    </div>
                                    <div class="col-md-2">
                                        <label>Cantidad</label>
                                        <input type="number" id="cantidad" class="form-control" value="1" min="1">
                                    </div>
                                    <div class="col-md-2">
                                        <label>Precio unitario</label>
                                        <input type="number" step="0.01" id="precioUnitario" class="form-control" placeholder="0.00">
                                    </div>
                                    <div class="col-md-1">
                                        <button type="button" id="agregarItem" class="btn btn-primary">Agregar</button>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-sm" id="tablaItems">
                                        <thead>
                                            <tr>
                                                <th>Concepto</th>
                                                <th>Cantidad</th>
                                                <th>Precio unitario (S/)</th>
                                                <th>Subtotal (S/)</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="item, iterStat : ${cotizacion.items}">
                                                <td>
                                                    <input type="hidden" th:name="'items[' + ${iterStat.index} + '].concepto'" th:value="${item.concepto}">
                                                    <span th:text="${item.concepto}"></span>
                                                </td>
                                                <td>
                                                    <input type="hidden" th:name="'items[' + ${iterStat.index} + '].cantidad'" th:value="${item.cantidad}">
                                                    <span th:text="${item.cantidad}"></span>
                                                </td>
                                                <td>
                                                    <input type="hidden" th:name="'items[' + ${iterStat.index} + '].precioUnitario'" th:value="${item.precioUnitario}">
                                                    <span th:text="${#numbers.formatDecimal(item.precioUnitario, 1, 2)}"></span>
                                                </td>
                                                <td class="subtotal-item" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                                                <td><button type="button" class="btn btn-sm btn-danger eliminar-item"><i class="bi bi-trash"></i></button></td>
                                            </tr>
                                        </tbody>
                                        <tfoot>
                                            <tr>
                                                <td colspan="3" class="text-end"><strong>Subtotal (sin IGV):</strong></td>
                                                <td><input type="text" id="subtotal" name="subtotal" class="form-control-plaintext" readonly value="0.00"></td>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <td colspan="3" class="text-end"><strong>IGV (18%):</strong></td>
                                                <td><input type="text" id="igv" name="igv" class="form-control-plaintext" readonly value="0.00"></td>
                                                <td></td>
                                            </tr>
                                            <tr>
                                                <td colspan="3" class="text-end"><strong>Total:</strong></td>
                                                <td><input type="text" id="total" name="total" class="form-control-plaintext fw-bold" readonly value="0.00"></td>
                                                <td></td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Guardar cotización</button>
                            <a th:href="@{/internal/cotizaciones/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3>Registrar pago</h3>
                </div>
                <div class="card-body">
                    <form id="formPago" th:action="@{/internal/pagos/guardar}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="proyectoId" class="form-label">Proyecto *</label>
                                <select id="proyectoId" name="proyecto.id" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="proj : ${proyectos}" th:value="${proj.id}" th:text="${proj.id + ' - ' + proj.cliente.nombreRazonSocial}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Saldo pendiente</label>
                                <span id="saldoPendiente" class="fw-bold text-info">S/ 0.00</span>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="monto" class="form-label">Monto *</label>
                                <input type="number" step="0.01" id="monto" name="monto" class="form-control" required>
                                <div id="montoError" class="invalid-feedback"></div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="fecha" class="form-label">Fecha *</label>
                                <input type="date" id="fecha" name="fecha" class="form-control" th:value="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="medioPago" class="form-label">Medio de pago *</label>
                                <select id="medioPago" name="medioPago" class="form-select" required>
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                    <option value="DEPOSITO">Depósito</option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="comprobanteNumero" class="form-label">N° comprobante (opcional)</label>
                                <input type="text" id="comprobanteNumero" name="comprobanteNumero" class="form-control">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Registrar pago</button>
                            <a th:href="@{/internal/pagos/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/pagos.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Detalle de pago #<span th:text="${pago.id}"></span></h1>
                <a th:href="@{/internal/pagos/lista}" class="btn btn-secondary">Volver al listado</a>
            </div>
            <div class="card">
                <div class="card-header">
                    <h4>Información del pago</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4"><strong>Proyecto:</strong> <span th:text="${pago.proyecto.id}"></span></div>
                        <div class="col-md-4"><strong>Cliente:</strong> <span th:text="${pago.proyecto.cliente.nombreRazonSocial}"></span></div>
                        <div class="col-md-4"><strong>Fecha:</strong> <span th:text="${#dates.format(pago.fecha, 'dd/MM/yyyy')}"></span></div>
                        <div class="col-md-4"><strong>Monto:</strong> S/ <span th:text="${#numbers.formatDecimal(pago.monto, 1, 2)}"></span></div>
                        <div class="col-md-4"><strong>Medio de pago:</strong> <span th:text="${pago.medioPago}"></span></div>
                        <div class="col-md-4"><strong>N° comprobante:</strong> <span th:text="${pago.comprobanteNumero != null ? pago.comprobanteNumero : '-'}"></span></div>
                        <div class="col-md-4"><strong>Estado:</strong>
                            <span th:if="${pago.estado == 'REGISTRADO'}" class="badge bg-success">Registrado</span>
                            <span th:if="${pago.estado == 'ANULADO'}" class="badge bg-danger">Anulado</span>
                        </div>
                    </div>
                    <div class="mt-3">
                        <a th:if="${pago.estado != 'ANULADO'}" th:href="@{/internal/pagos/anular/{id}(id=${pago.id})}" class="btn btn-danger">Anular pago</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3>Anular pago</h3>
                </div>
                <div class="card-body">
                    <p>Está a punto de anular el pago con los siguientes datos:</p>
                    <div class="row mb-3">
                        <div class="col-md-4"><strong>ID:</strong> <span th:text="${pago.id}"></span></div>
                        <div class="col-md-4"><strong>Proyecto:</strong> <span th:text="${pago.proyecto.id}"></span></div>
                        <div class="col-md-4"><strong>Cliente:</strong> <span th:text="${pago.proyecto.cliente.nombreRazonSocial}"></span></div>
                        <div class="col-md-4"><strong>Monto:</strong> S/ <span th:text="${#numbers.formatDecimal(pago.monto, 1, 2)}"></span></div>
                        <div class="col-md-4"><strong>Fecha:</strong> <span th:text="${#dates.format(pago.fecha, 'dd/MM/yyyy')}"></span></div>
                    </div>
                    <form th:action="@{/internal/pagos/anular/{id}(id=${pago.id})}" method="post">
                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo de la anulación *</label>
                            <textarea id="motivo" name="motivo" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger">Confirmar anulación</button>
                        <a th:href="@{/internal/pagos/detalle/{id}(id=${pago.id})}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Empleados</h1>
                <a th:href="@{/internal/usuarios/crear}" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Nuevo empleado
                </a>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaUsuarios" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${usuarios}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.nombre}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${user.rol}"></td>
                                    <td>
                                        <span th:if="${user.activo}" class="badge bg-success">Activo</span>
                                        <span th:unless="${user.activo}" class="badge bg-secondary">Inactivo</span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/internal/usuarios/editar/{id}(id=${user.id})}" class="btn btn-sm btn-warning" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:if="${user.activo}" th:action="@{/internal/usuarios/deshabilitar/{id}(id=${user.id})}" method="post" style="display:inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Deshabilitar" onclick="return confirm('¿Deshabilitar este usuario? No podrá iniciar sesión.')">
                                                    <i class="bi bi-ban"></i>
                                                </button>
                                            </form>
                                            <form th:unless="${user.activo}" th:action="@{/internal/usuarios/habilitar/{id}(id=${user.id})}" method="post" style="display:inline;">
                                                <button type="submit" class="btn btn-sm btn-success" title="Habilitar" onclick="return confirm('¿Habilitar este usuario nuevamente?')">
                                                    <i class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                            <a th:href="@{/internal/usuarios/reset-password/{id}(id=${user.id})}" class="btn btn-sm btn-info" title="Restablecer contraseña" onclick="return confirm('¿Enviar correo para restablecer la contraseña?')">
                                                <i class="bi bi-key"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/usuarios.js}"></script>
</body>
</html>

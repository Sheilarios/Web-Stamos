<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header bg-warning">
                    <h3>Restablecer contraseña</h3>
                </div>
                <div class="card-body">
                    <p>Está a punto de restablecer la contraseña del empleado:</p>
                    <div class="row mb-3">
                        <div class="col-md-4"><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></div>
                        <div class="col-md-4"><strong>Email:</strong> <span th:text="${usuario.email}"></span></div>
                        <div class="col-md-4"><strong>Rol:</strong> <span th:text="${usuario.rol}"></span></div>
                    </div>
                    <p>Se enviará un correo electrónico con un enlace para que el usuario pueda crear una nueva contraseña.</p>
                    <form th:action="@{/internal/usuarios/reset-password/{id}(id=${usuario.id})}" method="post">
                        <button type="submit" class="btn btn-warning">Confirmar restablecimiento</button>
                        <a th:href="@{/internal/usuarios/lista}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>

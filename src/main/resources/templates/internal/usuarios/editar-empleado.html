<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3>Editar empleado</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/internal/usuarios/actualizar/{id}(id=${usuario.id})}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre completo *</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" th:value="${usuario.nombre}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Correo electrónico *</label>
                                <input type="email" id="email" name="email" class="form-control" th:value="${usuario.email}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="rol" class="form-label">Rol *</label>
                                <select id="rol" name="rol" class="form-select" required>
                                    <option value="ADMINISTRADOR" th:selected="${usuario.rol == 'ADMINISTRADOR'}">Administrador</option>
                                    <option value="COMERCIAL" th:selected="${usuario.rol == 'COMERCIAL'}">Comercial</option>
                                    <option value="DISEÑADOR" th:selected="${usuario.rol == 'DISEÑADOR'}">Diseñador</option>
                                    <option value="PRODUCCION" th:selected="${usuario.rol == 'PRODUCCION'}">Producción</option>
                                    <option value="SOPORTE_TECNICO" th:selected="${usuario.rol == 'SOPORTE_TECNICO'}">Soporte Técnico</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                            <a th:href="@{/internal/usuarios/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                    <hr>
                    <div class="mt-2">
                        <a th:href="@{/internal/usuarios/reset-password/{id}(id=${usuario.id})}" class="btn btn-warning" onclick="return confirm('¿Enviar correo para restablecer la contraseña?')">
                            <i class="bi bi-key"></i> Restablecer contraseña
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/usuarios.js}"></script>
</body>
</html>

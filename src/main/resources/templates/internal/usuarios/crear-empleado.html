<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3>Nuevo empleado</h3>
                </div>
                <div class="card-body">
                    <form id="formUsuario" th:action="@{/internal/usuarios/guardar}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre completo *</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Correo electrónico *</label>
                                <input type="email" id="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="rol" class="form-label">Rol *</label>
                                <select id="rol" name="rol" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="ADMINISTRADOR">Administrador</option>
                                    <option value="COMERCIAL">Comercial</option>
                                    <option value="DISEÑADOR">Diseñador</option>
                                    <option value="PRODUCCION">Producción</option>
                                    <option value="SOPORTE_TECNICO">Soporte Técnico</option>
                                </select>
                                <small class="text-muted">El rol determina los permisos en el sistema.</small>
                            </div>
                        </div>
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> Se generará una contraseña temporal que será enviada al correo del empleado.
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Crear empleado</button>
                            <a th:href="@{/internal/usuarios/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/usuarios.js}"></script>
</body>
</html>

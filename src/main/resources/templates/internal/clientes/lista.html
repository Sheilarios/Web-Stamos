<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: header}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Clientes</h1>
                <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo cliente
                </a>
            </div>
            
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <input type="text" id="searchClientes" class="form-control" placeholder="Buscar por nombre, RUC o teléfono...">
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table id="tablaClientes" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre/Razón Social</th>
                                    <th>Tipo</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>RUC</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cliente : ${clientes}">
                                    <td th:text="${cliente.id}">1</td>
                                    <td th:text="${cliente.nombreRazonSocial}">Nombre Cliente</td>
                                    <td>
                                        <span th:if="${cliente.tipoPersona == 'PERSONA_NATURAL'}" class="badge bg-info">Natural</span>
                                        <span th:if="${cliente.tipoPersona == 'EMPRESA'}" class="badge bg-primary">Empresa</span>
                                    </td>
                                    <td th:text="${cliente.telefono}">987654321</td>
                                    <td th:text="${cliente.email}">cliente@email.com</td>
                                    <td th:text="${cliente.ruc}">12345678901</td>
                                    <td>
                                        <span th:if="${cliente.activo}" class="badge bg-success">Activo</span>
                                        <span th:unless="${cliente.activo}" class="badge bg-secondary">Deshabilitado</span>
                                    </td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-sm btn-info" title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}" class="btn btn-sm btn-warning" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:if="${cliente.activo}" th:action="@{/clientes/{id}/deshabilitar(id=${cliente.id})}" method="post" style="display:inline;">
                                                <input type="hidden" name="_method" value="DELETE" />
                                                <button type="submit" class="btn btn-sm btn-danger btn-deshabilitar" title="Deshabilitar" onclick="return confirm('¿Deshabilitar este cliente? No podrá generar nuevas cotizaciones.')">
                                                    <i class="bi bi-ban"></i>
                                                </button>
                                            </form>
                                            <form th:unless="${cliente.activo}" th:action="@{/clientes/{id}/habilitar(id=${cliente.id})}" method="post" style="display:inline;">
                                                <input type="hidden" name="_method" value="PUT" />
                                                <button type="submit" class="btn btn-sm btn-success btn-habilitar" title="Habilitar" onclick="return confirm('¿Habilitar este cliente nuevamente?')">
                                                    <i class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                        </div>
                                     </td>
                                </tr>
                                <tr th:if="${clientes == null or clientes.isEmpty()}">
                                    <td colspan="8" class="text-center">No hay clientes registrados</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    
    <script>
        $(document).ready(function() {
            $('#tablaClientes').DataTable({
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                },
                order: [[0, 'desc']]
            });
            
            $('#searchClientes').on('keyup', function() {
                $('#tablaClientes').DataTable().search($(this).val()).draw();
            });
        });
    </script>
</body>
</html>

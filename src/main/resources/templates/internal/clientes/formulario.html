<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: header}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 th:if="${cliente.id == null}">Nuevo Cliente</h1>
                <h1 th:unless="${cliente.id == null}">Editar Cliente</h1>
                <a th:href="@{/clientes}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3 th:if="${cliente.id == null}">Complete los datos del cliente</h3>
                    <h3 th:unless="${cliente.id == null}">Actualice los datos del cliente</h3>
                </div>
                <div class="card-body">
                    <form id="formCliente" th:if="${cliente.id == null}" th:action="@{/clientes}" method="post" th:object="${cliente}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo de persona *</label>
                                <select th:field="*{tipoPersona}" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="PERSONA_NATURAL">Persona Natural</option>
                                    <option value="EMPRESA">Empresa</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre / Razón social *</label>
                                <input type="text" th:field="*{nombreRazonSocial}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono *</label>
                                <input type="tel" th:field="*{telefono}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">RUC (solo empresas)</label>
                                <input type="text" th:field="*{ruc}" class="form-control">
                                <small class="text-muted">Opcional para personas naturales, obligatorio para empresas.</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre de Contacto</label>
                                <input type="text" th:field="*{nombreContacto}" class="form-control">
                                <small class="text-muted">Persona de referencia en la empresa</small>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Dirección</label>
                                <textarea th:field="*{direccion}" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ciudad</label>
                                <input type="text" th:field="*{ciudad}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Departamento</label>
                                <input type="text" th:field="*{departamento}" class="form-control">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                    
                    <form id="formClienteEdit" th:unless="${cliente.id == null}" th:action="@{/clientes/{id}(id=${cliente.id})}" method="post" th:object="${cliente}">
                        <input type="hidden" name="_method" value="PUT" />
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo de persona *</label>
                                <select th:field="*{tipoPersona}" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="PERSONA_NATURAL">Persona Natural</option>
                                    <option value="EMPRESA">Empresa</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre / Razón social *</label>
                                <input type="text" th:field="*{nombreRazonSocial}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono *</label>
                                <input type="tel" th:field="*{telefono}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">RUC (solo empresas)</label>
                                <input type="text" th:field="*{ruc}" class="form-control">
                                <small class="text-muted">Opcional para personas naturales, obligatorio para empresas.</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre de Contacto</label>
                                <input type="text" th:field="*{nombreContacto}" class="form-control">
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Dirección</label>
                                <textarea th:field="*{direccion}" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ciudad</label>
                                <input type="text" th:field="*{ciudad}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Departamento</label>
                                <input type="text" th:field="*{departamento}" class="form-control">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    
    <script>
        $(document).ready(function() {
            $('#tipoPersona').on('change', function() {
                var tipo = $(this).val();
                var rucField = $('#ruc');
                if (tipo === 'EMPRESA') {
                    rucField.prop('required', true);
                    rucField.closest('.col-md-6').find('small').text('Obligatorio para empresas (11 dígitos)');
                } else {
                    rucField.prop('required', false);
                    rucField.closest('.col-md-6').find('small').text('Opcional para personas naturales');
                }
            });
            
            $('#formCliente, #formClienteEdit').on('submit', function(e) {
                var tipo = $('#tipoPersona').val();
                var ruc = $('#ruc').val();
                
                if (tipo === 'EMPRESA') {
                    if (!ruc || ruc.trim() === '') {
                        alert('El RUC es obligatorio para empresas');
                        e.preventDefault();
                        return false;
                    }
                    if (!/^\d{11}$/.test(ruc)) {
                        alert('El RUC debe tener 11 dígitos numéricos');
                        e.preventDefault();
                        return false;
                    }
                }
                
                var email = $('#email').val();
                if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert('Ingrese un email válido');
                    e.preventDefault();
                    return false;
                }
                
                var telefono = $('#telefono').val();
                if (telefono && !/^\d{7,15}$/.test(telefono)) {
                    alert('Ingrese un teléfono válido (solo números, 7-15 dígitos)');
                    e.preventDefault();
                    return false;
                }
                
                return true;
            });
            
            $('#tipoPersona').trigger('change');
        });
    </script>
</body>
</html>

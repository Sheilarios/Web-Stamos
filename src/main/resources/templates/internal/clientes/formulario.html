<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 th:if="${action == 'crear'}">Nuevo cliente</h3>
                    <h3 th:if="${action == 'editar'}">Editar cliente</h3>
                </div>
                <div class="card-body">
                    <form id="formCliente" th:action="@{${action == 'crear'} ? '/internal/clientes/guardar' : '/internal/clientes/actualizar/' + cliente.id}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="tipoPersona" class="form-label">Tipo de persona *</label>
                                <select id="tipoPersona" name="tipoPersona" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="PERSONA_NATURAL" th:selected="${cliente.tipoPersona == 'PERSONA_NATURAL'}">Persona Natural</option>
                                    <option value="EMPRESA" th:selected="${cliente.tipoPersona == 'EMPRESA'}">Empresa</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="nombreRazonSocial" class="form-label">Nombre / Razón social *</label>
                                <input type="text" id="nombreRazonSocial" name="nombreRazonSocial" class="form-control" th:value="${cliente.nombreRazonSocial}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono *</label>
                                <input type="tel" id="telefono" name="telefono" class="form-control" th:value="${cliente.telefono}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" id="email" name="email" class="form-control" th:value="${cliente.email}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="ruc" class="form-label">RUC (solo empresas)</label>
                                <input type="text" id="ruc" name="ruc" class="form-control" th:value="${cliente.ruc}">
                                <small class="text-muted">Opcional para personas naturales.</small>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a th:href="@{/internal/clientes/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/clientes.js}"></script>
</body>
</html>

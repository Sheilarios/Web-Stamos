<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Proyectos</h1>
                <a th:href="@{/internal/proyectos/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo proyecto
                </a>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label>Filtrar por estado</label>
                            <select id="filtroEstado" class="form-select">
                                <option value="">Todos</option>
                                <option value="COTIZADO">Cotizado</option>
                                <option value="APROBADO">Aprobado</option>
                                <option value="EN_DISEÑO">En diseño</option>
                                <option value="EN_PRODUCCION">En producción</option>
                                <option value="INSTALACION_MONTAJE">Instalación/Montaje</option>
                                <option value="ENTREGADO">Entregado</option>
                                <option value="ANULADO">Anulado</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Filtrar por cliente</label>
                            <select id="filtroCliente" class="form-select">
                                <option value="">Todos los clientes</option>
                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreRazonSocial}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table id="tablaProyectos" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Estado</th>
                                    <th>Fecha creación</th>
                                    <th>Entrega estimada</th>
                                    <th>Responsable</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${proyectos}">
                                    <td th:text="${p.id}"></td>
                                    <td th:text="${p.cliente.nombreRazonSocial}"></td>
                                    <td><span class="badge" th:classappend="${p.estado == 'ENTREGADO' ? 'bg-success' : (p.estado == 'ANULADO' ? 'bg-danger' : 'bg-secondary')}" th:text="${p.estado}"></span></td>
                                    <td th:text="${#dates.format(p.fechaCreacion, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${p.fechaEntregaEstimada != null ? #dates.format(p.fechaEntregaEstimada, 'dd/MM/yyyy') : '-'}"></td>
                                    <td th:text="${p.responsable != null ? p.responsable.nombre : '-'}"></td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/internal/proyectos/detalle/{id}(id=${p.id})}" class="btn btn-sm btn-info" title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/internal/proyectos/cambiar-estado/{id}(id=${p.id})}" class="btn btn-sm btn-warning" title="Cambiar estado">
                                                <i class="bi bi-arrow-repeat"></i>
                                            </a>
                                            <a th:href="@{/internal/proyectos/archivos/{id}(id=${p.id})}" class="btn btn-sm btn-secondary" title="Archivos">
                                                <i class="bi bi-files"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/proyectos.js}"></script>
</body>
</html>

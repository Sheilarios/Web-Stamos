<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3>Asignar responsable al proyecto #<span th:text="${proyecto.id}"></span></h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/internal/proyectos/asignar-responsable/{id}(id=${proyecto.id})}" method="post">
                        <div class="mb-3">
                            <label for="usuarioId" class="form-label">Responsable</label>
                            <select id="usuarioId" name="usuarioId" class="form-select" required>
                                <option value="">Seleccione...</option>
                                <option th:each="user : ${usuarios}" th:value="${user.id}" th:text="${user.nombre + ' (' + user.rol + ')'}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/internal/proyectos/detalle/{id}(id=${proyecto.id})}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Archivos del proyecto #<span th:text="${proyecto.id}"></span></h1>
                <div>
                    <a th:href="@{/internal/proyectos/detalle/{id}(id=${proyecto.id})}" class="btn btn-secondary">Volver al proyecto</a>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-header">
                    <h4>Subir nuevo archivo</h4>
                </div>
                <div class="card-body">
                    <form id="formSubirArchivo" th:action="@{/internal/proyectos/subir-archivo/{id}(id=${proyecto.id})}" method="post" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="tipo" class="form-label">Tipo de archivo</label>
                                <select id="tipo" name="tipo" class="form-select" required>
                                    <option value="RENDER">Render 3D</option>
                                    <option value="PLANO">Plano técnico</option>
                                    <option value="BOCETO">Boceto</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="file" class="form-label">Archivo</label>
                                <input type="file" id="file" name="file" class="form-control" accept=".jpg,.png,.pdf,.dwg" required>
                            </div>
                            <div class="col-md-4 mb-3 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary">Subir archivo</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h4>Archivos subidos</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaArchivos" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Tipo</th>
                                    <th>Fecha subida</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="arch : ${archivos}">
                                    <td th:text="${arch.nombreArchivo}"></td>
                                    <td><span class="badge" th:classappend="${arch.tipo == 'RENDER' ? 'bg-info' : (arch.tipo == 'PLANO' ? 'bg-warning' : 'bg-secondary')}" th:text="${arch.tipo}"></span></td>
                                    <td th:text="${#dates.format(arch.fechaSubida, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/internal/proyectos/descargar-archivo/{id}(id=${arch.id})}" class="btn btn-sm btn-success" target="_blank">Descargar</a>
                                        <form th:action="@{/internal/proyectos/eliminar-archivo/{id}(id=${arch.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Eliminar este archivo?')">
                                            <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script>
        $(document).ready(function() {
            $('#tablaArchivos').DataTable({
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                order: [[2, 'desc']],
                pageLength: 5
            });
        });
    </script>
</body>
</html>

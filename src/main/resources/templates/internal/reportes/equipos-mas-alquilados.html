<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Equipos más alquilados</h1>
                <div>
                    <a th:href="@{/internal/reportes/equipos-mas-alquilados/export/excel}" class="btn btn-success me-2">
                        <i class="bi bi-file-earmark-excel"></i> Exportar Excel
                    </a>
                    <a th:href="@{/internal/reportes/equipos-mas-alquilados/export/pdf}" class="btn btn-danger">
                        <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
                    </a>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaEquiposMasAlquilados" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Equipo ID</th>
                                    <th>Nombre</th>
                                    <th>Cantidad Total Alquilada</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="row : ${equipos}">
                                    <td th:text="${row[0]}"></td>
                                    <td th:text="${row[1]}"></td>
                                    <td th:text="${row[2]}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script>
        $(document).ready(function() {
            $('#tablaEquiposMasAlquilados').DataTable({
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                order: [[2, 'desc']],
                pageLength: 10,
                responsive: true
            });
        });
    </script>
</body>
</html>

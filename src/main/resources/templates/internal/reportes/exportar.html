<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <h1 class="mb-4">Exportar reportes</h1>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-header">
                            <h5>Pagos pendientes por cliente</h5>
                        </div>
                        <div class="card-body">
                            <a th:href="@{/internal/reportes/pagos-pendientes/export/excel}" class="btn btn-success me-2">Excel</a>
                            <a th:href="@{/internal/reportes/pagos-pendientes/export/pdf}" class="btn btn-danger">PDF</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-header">
                            <h5>Proyectos atrasados</h5>
                        </div>
                        <div class="card-body">
                            <a th:href="@{/internal/reportes/proyectos-atrasados/export/excel}" class="btn btn-success me-2">Excel</a>
                            <a th:href="@{/internal/reportes/proyectos-atrasados/export/pdf}" class="btn btn-danger">PDF</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-header">
                            <h5>Equipos más alquilados</h5>
                        </div>
                        <div class="card-body">
                            <a th:href="@{/internal/reportes/equipos-mas-alquilados/export/excel}" class="btn btn-success me-2">Excel</a>
                            <a th:href="@{/internal/reportes/equipos-mas-alquilados/export/pdf}" class="btn btn-danger">PDF</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-header">
                            <h5>Cotizaciones aprobadas vs rechazadas</h5>
                        </div>
                        <div class="card-body">
                            <a th:href="@{/internal/reportes/cotizaciones-estado/export/excel}" class="btn btn-success me-2">Excel</a>
                            <a th:href="@{/internal/reportes/cotizaciones-estado/export/pdf}" class="btn btn-danger">PDF</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-header">
                            <h5>Ingresos por período</h5>
                        </div>
                        <div class="card-body">
                            <p>Seleccione parámetros en la página de ingresos.</p>
                            <a th:href="@{/internal/reportes/ingresos}" class="btn btn-secondary">Ir a ingresos</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>

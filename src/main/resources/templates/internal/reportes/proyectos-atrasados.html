<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Proyectos atrasados</h1>
                <div>
                    <a th:href="@{/internal/reportes/proyectos-atrasados/export/excel}" class="btn btn-success me-2">
                        <i class="bi bi-file-earmark-excel"></i> Exportar Excel
                    </a>
                    <a th:href="@{/internal/reportes/proyectos-atrasados/export/pdf}" class="btn btn-danger">
                        <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
                    </a>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaProyectosAtrasados" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Estado</th>
                                    <th>Fecha Entrega Estimada</th>
                                    <th>Responsable</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${proyectos}">
                                    <td th:text="${p.id}"></td>
                                    <td th:text="${p.cliente.nombreRazonSocial}"></td>
                                    <td th:text="${p.estado}"></td>
                                    <td th:text="${#dates.format(p.fechaEntregaEstimada, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${p.responsable != null ? p.responsable.nombre : '-'}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script>
        $(document).ready(function() {
            $('#tablaProyectosAtrasados').DataTable({
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                order: [[3, 'asc']],
                pageLength: 10,
                responsive: true
            });
        });
    </script>
</body>
</html>

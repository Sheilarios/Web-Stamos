<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Pagos pendientes por cliente</h1>
                <div>
                    <a th:href="@{/internal/reportes/pagos-pendientes/export/excel}" class="btn btn-success me-2">
                        <i class="bi bi-file-earmark-excel"></i> Exportar Excel
                    </a>
                    <a th:href="@{/internal/reportes/pagos-pendientes/export/pdf}" class="btn btn-danger">
                        <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
                    </a>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaPagosPendientes" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Cliente ID</th>
                                    <th>Cliente</th>
                                    <th>Total Pagado (S/)</th>
                                    <th>Total Cotización (S/)</th>
                                    <th>Saldo Pendiente (S/)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="row : ${pendientes}">
                                    <td th:text="${row[0]}"></td>
                                    <td th:text="${row[1]}"></td>
                                    <td th:text="${#numbers.formatDecimal(row[2], 1, 2)}"></td>
                                    <td th:text="${#numbers.formatDecimal(row[3], 1, 2)}"></td>
                                    <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(row[4], 1, 2)}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script>
        $(document).ready(function() {
            $('#tablaPagosPendientes').DataTable({
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                order: [[4, 'desc']],
                pageLength: 10,
                responsive: true
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <h1 class="mb-4">Filtros de reportes</h1>
            <div class="card">
                <div class="card-body">
                    <form action="#" method="get" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tipo de reporte</label>
                            <select class="form-select" id="reporteSelect">
                                <option value="pagos-pendientes">Pagos pendientes por cliente</option>
                                <option value="proyectos-atrasados">Proyectos atrasados</option>
                                <option value="equipos-mas-alquilados">Equipos más alquilados</option>
                                <option value="cotizaciones-estado">Cotizaciones aprobadas vs rechazadas</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha desde (opcional)</label>
                            <input type="date" id="fechaDesde" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha hasta (opcional)</label>
                            <input type="date" id="fechaHasta" class="form-control">
                        </div>
                        <div class="col-md-12">
                            <button type="button" id="aplicarFiltros" class="btn btn-primary">Aplicar filtros</button>
                            <a th:href="@{/internal/reportes/panel}" class="btn btn-secondary">Volver al panel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script>
        $(document).ready(function() {
            $('#aplicarFiltros').on('click', function() {
                const reporte = $('#reporteSelect').val();
                const desde = $('#fechaDesde').val();
                const hasta = $('#fechaHasta').val();
                let url = '/internal/reportes/' + reporte;
                const params = [];
                if (desde) params.push('fechaDesde=' + desde);
                if (hasta) params.push('fechaHasta=' + hasta);
                if (params.length) url += '?' + params.join('&');
                window.location.href = url;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="row justify-content-center mt-5">
                <div class="col-md-6 text-center">
                    <div class="error-template">
                        <h1 class="display-1 text-warning">403</h1>
                        <h2>Acceso denegado</h2>
                        <div class="error-details my-3">
                            <p>No tienes permisos suficientes para acceder a esta página.</p>
                            <p>Por favor, contacta con el administrador si crees que esto es un error.</p>
                        </div>
                        <div class="error-actions mt-4">
                            <a th:href="@{/}" class="btn btn-primary btn-lg">
                                <i class="bi bi-house-door"></i> Ir al inicio
                            </a>
                            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">
                                <i class="bi bi-arrow-left"></i> Volver atrás
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Catálogo de equipos</h1>
                <a th:href="@{/internal/inventario/equipos/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo equipo
                </a>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaEquipos" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Cantidad total</th>
                                    <th>Ubicación</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="equipo : ${equipos}">
                                    <td th:text="${equipo.id}"></td>
                                    <td th:text="${equipo.nombre}"></td>
                                    <td th:text="${equipo.cantidadTotal}"></td>
                                    <td th:text="${equipo.ubicacion}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/internal/inventario/equipos/detalle/{id}(id=${equipo.id})}" class="btn btn-sm btn-info" title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/internal/inventario/equipos/editar/{id}(id=${equipo.id})}" class="btn btn-sm btn-warning" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/internal/inventario/equipos/eliminar/{id}(id=${equipo.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Eliminar este equipo? Se perderán todas sus reservas asociadas.');">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/inventario.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Detalle del equipo</h1>
                <a th:href="@{/internal/inventario/equipos/lista}" class="btn btn-secondary">Volver al listado</a>
            </div>
            <div class="card mb-4">
                <div class="card-header">
                    <h4>Información del equipo</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4"><strong>ID:</strong> <span th:text="${equipo.id}"></span></div>
                        <div class="col-md-4"><strong>Nombre:</strong> <span th:text="${equipo.nombre}"></span></div>
                        <div class="col-md-4"><strong>Cantidad total:</strong> <span th:text="${equipo.cantidadTotal}"></span></div>
                        <div class="col-md-4"><strong>Ubicación:</strong> <span th:text="${equipo.ubicacion}"></span></div>
                    </div>
                    <div class="mt-3">
                        <a th:href="@{/internal/inventario/equipos/editar/{id}(id=${equipo.id})}" class="btn btn-warning">Editar</a>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h4>Historial de reservas</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaReservas" class="table table-sm table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Proyecto</th>
                                    <th>Cliente</th>
                                    <th>Fecha inicio</th>
                                    <th>Fecha fin</th>
                                    <th>Cantidad</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="res : ${reservas}">
                                    <td th:text="${res.id}"></td>
                                    <td>
                                        <a th:href="@{/internal/proyectos/detalle/{id}(id=${res.proyecto.id})}" target="_blank">
                                            <span th:text="${res.proyecto.id}"></span>
                                        </a>
                                    </td>
                                    <td th:text="${res.proyecto.cliente.nombreRazonSocial}"></td>
                                    <td th:text="${#dates.format(res.fechaInicio, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${#dates.format(res.fechaFin, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${res.cantidad}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(reservas)}">
                                    <td colspan="6" class="text-center">No hay reservas asociadas a este equipo.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/inventario.js}"></script>
    <script>
        $(document).ready(function() {
            if ($('#tablaReservas').length && $('#tablaReservas tbody tr').length > 0) {
                $('#tablaReservas').DataTable({
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                    order: [[3, 'desc']],
                    pageLength: 10,
                    responsive: true
                });
            }
        });
    </script>
</body>
</html>

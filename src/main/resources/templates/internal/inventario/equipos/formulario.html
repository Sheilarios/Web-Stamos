<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 th:if="${action == 'crear'}">Nuevo equipo</h3>
                    <h3 th:if="${action == 'editar'}">Editar equipo</h3>
                </div>
                <div class="card-body">
                    <form id="formEquipo" th:action="@{${action == 'crear'} ? '/internal/inventario/equipos/guardar' : '/internal/inventario/equipos/actualizar/' + equipo.id}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre del equipo *</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" th:value="${equipo.nombre}" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="cantidadTotal" class="form-label">Cantidad total *</label>
                                <input type="number" id="cantidadTotal" name="cantidadTotal" class="form-control" th:value="${equipo.cantidadTotal}" min="0" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="ubicacion" class="form-label">Ubicación *</label>
                                <input type="text" id="ubicacion" name="ubicacion" class="form-control" th:value="${equipo.ubicacion}" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a th:href="@{/internal/inventario/equipos/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
</body>
</html>

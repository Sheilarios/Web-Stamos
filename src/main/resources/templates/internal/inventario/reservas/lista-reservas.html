<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Reservas de equipos</h1>
                <a th:href="@{/internal/inventario/reservas/nueva}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nueva reserva
                </a>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaReservas" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Equipo</th>
                                    <th>Proyecto</th>
                                    <th>Cliente</th>
                                    <th>Fecha inicio</th>
                                    <th>Fecha fin</th>
                                    <th>Cantidad</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="res : ${reservas}">
                                    <td th:text="${res.id}"></td>
                                    <td th:text="${res.equipo.nombre}"></td>
                                    <td>
                                        <a th:href="@{/internal/proyectos/detalle/{id}(id=${res.proyecto.id})}" target="_blank">
                                            <span th:text="${res.proyecto.id}"></span>
                                        </a>
                                    </td>
                                    <td th:text="${res.proyecto.cliente.nombreRazonSocial}"></td>
                                    <td th:text="${#dates.format(res.fechaInicio, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${#dates.format(res.fechaFin, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${res.cantidad}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/internal/inventario/reservas/editar/{id}(id=${res.id})}" class="btn btn-sm btn-warning" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/internal/inventario/reservas/cancelar/{id}(id=${res.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Cancelar esta reserva? Se liberará el equipo.');">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Cancelar">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/inventario.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3 th:if="${reserva.id == null}">Nueva reserva</h3>
                    <h3 th:if="${reserva.id != null}">Editar reserva</h3>
                </div>
                <div class="card-body">
                    <form id="formReserva" th:action="@{${reserva.id == null} ? '/internal/inventario/reservas/guardar' : '/internal/inventario/reservas/actualizar/' + reserva.id}" method="post">
                        <input type="hidden" id="reservaId" th:value="${reserva.id}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="equipoId" class="form-label">Equipo *</label>
                                <select id="equipoId" name="equipo.id" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="eq : ${equipos}" th:value="${eq.id}" th:text="${eq.nombre}" th:selected="${reserva.equipo != null and reserva.equipo.id == eq.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="proyectoId" class="form-label">Proyecto *</label>
                                <select id="proyectoId" name="proyecto.id" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="proj : ${proyectos}" th:value="${proj.id}" th:text="${proj.id + ' - ' + proj.cliente.nombreRazonSocial}" th:selected="${reserva.proyecto != null and reserva.proyecto.id == proj.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="fechaInicio" class="form-label">Fecha inicio *</label>
                                <input type="date" id="fechaInicio" name="fechaInicio" class="form-control" th:value="${#dates.format(reserva.fechaInicio, 'yyyy-MM-dd')}" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="fechaFin" class="form-label">Fecha fin *</label>
                                <input type="date" id="fechaFin" name="fechaFin" class="form-control" th:value="${#dates.format(reserva.fechaFin, 'yyyy-MM-dd')}" required>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="cantidad" class="form-label">Cantidad *</label>
                                <input type="number" id="cantidad" name="cantidad" class="form-control" th:value="${reserva.cantidad}" min="1" required>
                            </div>
                        </div>
                        <div id="disponibilidadMsg" class="mb-3"></div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Guardar reserva</button>
                            <a th:href="@{/internal/inventario/reservas/lista}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/inventario.js}"></script>
</body>
</html>

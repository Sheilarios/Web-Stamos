<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <h1 class="mb-4">Conflictos de disponibilidad</h1>
            <div class="alert alert-warning" role="alert">
                <i class="bi bi-exclamation-triangle"></i> Se han detectado reservas que se solapan o equipos con stock insuficiente.
            </div>
            <div class="card">
                <div class="card-header">
                    <h4>Reservas solapadas</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tablaConflictos" class="table table-danger">
                            <thead>
                                <tr>
                                    <th>Equipo</th>
                                    <th>Proyecto A</th>
                                    <th>Fechas A</th>
                                    <th>Proyecto B</th>
                                    <th>Fechas B</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="conf : ${conflictos}">
                                    <td th:text="${conf.equipoNombre}"></td>
                                    <td th:text="${conf.proyectoANombre}"></td>
                                    <td th:text="${#dates.format(conf.fechaInicioA, 'dd/MM/yyyy')} + ' - ' + ${#dates.format(conf.fechaFinA, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${conf.proyectoBNombre}"></td>
                                    <td th:text="${#dates.format(conf.fechaInicioB, 'dd/MM/yyyy')} + ' - ' + ${#dates.format(conf.fechaFinB, 'dd/MM/yyyy')}"></td>
                                    <td>
                                        <a th:href="@{/internal/inventario/reservas/editar/{id}(id=${conf.reservaId})}" class="btn btn-sm btn-warning">Editar reserva</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/inventario.js}"></script>
</body>
</html>

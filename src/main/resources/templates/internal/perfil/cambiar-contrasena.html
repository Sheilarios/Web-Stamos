<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{interal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-header">
                    <h3>Cambiar contraseña</h3>
                </div>
                <div class="card-body">
                    <form id="formCambiarPassword" th:action="@{/cambiar-contraseña}" method="post">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Contraseña actual</label>
                            <div class="input-group">
                                <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="#currentPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Nueva contraseña</label>
                            <div class="input-group">
                                <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="#newPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small class="text-muted">Mínimo 8 caracteres, incluyendo mayúsculas, minúsculas y números.</small>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmar nueva contraseña</label>
                            <div class="input-group">
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="#confirmPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
                            <a th:href="@{/internal/usuarios/perfil}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/perfil.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{interal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Mi perfil</h1>
                <a th:href="@{/internal/usuarios/perfil/cambiar-contrasena}" class="btn btn-warning">
                    <i class="bi bi-key"></i> Cambiar contraseña
                </a>
            </div>
            <div class="card">
                <div class="card-header">
                    <h4>Información personal</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
                            <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
                            <p><strong>Rol:</strong> 
                                <span class="badge bg-info" th:text="${usuario.rol}"></span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Estado:</strong>
                                <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                                <span th:unless="${usuario.activo}" class="badge bg-secondary">Inactivo</span>
                            </p>
                            <p><strong>Cuenta creada:</strong> <span th:text="${#dates.format(usuario.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span></p>
                            <p><strong>Último acceso:</strong> <span th:text="${usuario.ultimoAcceso != null ? #dates.format(usuario.ultimoAcceso, 'dd/MM/yyyy HH:mm') : 'Nunca'}"></span></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card mt-4">
                <div class="card-header">
                    <h4>Acciones rápidas</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <a th:href="@{/internal/usuarios/perfil/actividad-reciente}" class="btn btn-outline-primary w-100">
                                <i class="bi bi-clock-history"></i> Ver actividad reciente
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/internal/usuarios/perfil/cambiar-contrasena}" class="btn btn-outline-warning w-100">
                                <i class="bi bi-key"></i> Cambiar contraseña
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
</body>
</html>

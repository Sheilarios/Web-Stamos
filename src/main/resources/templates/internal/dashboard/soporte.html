<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}"></head>
<body>
    <div th:replace="~{layout/header :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <h1 class="mb-4">Panel de Soporte Técnico</h1>
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-white bg-info mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Equipos totales</h5>
                            <p class="card-text display-6" id="totalEquipos">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white bg-warning mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Reservas activas</h5>
                            <p class="card-text display-6" id="reservasActivas">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white bg-success mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Equipos en mantenimiento</h5>
                            <p class="card-text display-6" id="equiposMantenimiento">-</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="card mb-4">
                        <div class="card-header">Próximas reservas (7 días)</div>
                        <div class="card-body table-responsive">
                            <table class="table table-sm" id="proximasReservas">
                                <thead><tr><th>Equipo</th><th>Proyecto</th><th>Fecha inicio</th><th>Fecha fin</th><th>Cantidad</th></tr></thead>
                                <tbody><tr><td colspan="5" class="text-center">Cargando...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">Equipos con baja disponibilidad</div>
                        <div class="card-body table-responsive">
                            <table class="table table-sm" id="equiposBajaDisponibilidad">
                                <thead><tr><th>Equipo</th><th>Stock total</th><th>Disponible</th><th>Ubicación</th></tr></thead>
                                <tbody><tr><td colspan="4" class="text-center">Cargando...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/dashboard-soporte.js}"></script>
</body>
</html>

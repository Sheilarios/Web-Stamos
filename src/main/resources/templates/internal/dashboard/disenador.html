<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{internal/layout/header :: head}"></head>
<body>
    <div th:replace="~{internal/layout/header :: topbar}"></div>
    <div th:replace="~{internal/layout/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="container-fluid">
            <h1 class="mb-4">Panel de Diseñador</h1>
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-white bg-primary mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Proyectos asignados</h5>
                            <p class="card-text display-6" id="misProyectos">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white bg-warning mb-3">
                        <div class="card-body">
                            <h5 class="card-title">En diseño</h5>
                            <p class="card-text display-6" id="proyectosDiseno">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white bg-success mb-3">
                        <div class="card-body">
                            <h5 class="card-title">En producción</h5>
                            <p class="card-text display-6" id="proyectosProduccion">-</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">Mis proyectos activos</div>
                        <div class="card-body table-responsive">
                            <table class="table table-sm" id="misProyectosTabla">
                                <thead><tr><th>ID</th><th>Cliente</th><th>Estado</th><th>Fecha entrega</th><th>Acciones</th></tr></thead>
                                <tbody><tr><td colspan="5" class="text-center">Cargando...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{internal/layout/footer :: scripts}"></div>
    <script th:src="@{/internal/js/dashboard-disenador.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error · STAMOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F5F6F8;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .error-icon {
            width: 80px;
            height: 80px;
            background: #FFF0EE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .error-icon i { font-size: 40px; color: #C0392B; }
        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            color: #5A6478;
            margin-bottom: 8px;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #1A1F2E;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #5A6478;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-home {
            background: #F5C400;
            color: #2A1800;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background: #FFE566;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="ti ti-alert-circle"></i>
        </div>
        <div class="error-code">Error</div>
        <h1>Algo salió mal</h1>
        <p>Ha ocurrido un error inesperado. Por favor, intenta nuevamente.</p>
        <a href="/internal/dashboard" class="btn-home">
            <i class="ti ti-home"></i> Volver al Dashboard
        </a>
    </div>
</body>
</html>

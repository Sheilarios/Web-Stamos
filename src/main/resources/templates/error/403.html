<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado · STAMOS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --red: #C0392B;
            --red-light: #FFF0EE;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #E8ECF1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .error-container {
            max-width: 500px;
            width: 100%;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            padding: 48px 32px;
        }
        
        .error-icon {
            width: 80px;
            height: 80px;
            background: var(--red-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .error-icon i {
            font-size: 40px;
            color: var(--red);
        }
        
        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            color: var(--text-2);
            margin-bottom: 8px;
        }
        
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }
        
        p {
            font-size: 14px;
            color: var(--text-2);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .btn-home {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-home:hover {
            background: #FFE566;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="ti ti-lock"></i>
        </div>
        <div class="error-code">403</div>
        <h1>Acceso denegado</h1>
        <p>No tienes permisos suficientes para acceder a esta página.</p>
        <a href="/internal/dashboard" class="btn-home">
            <i class="ti ti-home"></i> Volver al Dashboard
        </a>
    </div>
</body>
</html>

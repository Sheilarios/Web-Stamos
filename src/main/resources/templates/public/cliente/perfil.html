<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil · STAMOS</title>
</head>
<body>
<div style="max-width:600px; margin:40px auto;">
    <h2>Mi perfil</h2>
    <form th:action="@{/public/cliente/perfil/actualizar}" method="post">
        <label>Nombre / Razón social</label>
        <input th:value="${cliente.nombreRazonSocial}" name="nombreRazonSocial">
        <label>Teléfono</label>
        <input th:value="${cliente.telefono}" name="telefono">
        <label>Email</label>
        <input th:value="${cliente.email}" name="email" type="email">
        <button type="submit">Actualizar datos</button>
    </form>
    <a th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
</div>
</body>
</html>

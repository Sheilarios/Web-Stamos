<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dejar una reseña · STAMOS</title>
</head>
<body>
<div style="max-width:600px; margin:40px auto;">
    <h2>Califica tu experiencia</h2>
    <form th:action="@{/resenas/cliente/guardar}" method="post">
        <input type="hidden" name="proyectoId" th:value="${proyecto.id}">
        <label>Calificación (1 a 5)</label>
        <select name="calificacion">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
        <label>Comentario</label>
        <textarea name="comentario" rows="4"></textarea>
        <button type="submit">Enviar reseña</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña · STAMOS</title>
    <style>
        body{background:#080b11;font-family:'DM Sans',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .card{background:#0f1219;border:0.5px solid #1a2535;border-radius:20px;width:400px;padding:32px}
        input{width:100%;background:#0d1220;border:0.5px solid #1a2030;border-radius:8px;padding:10px;margin-bottom:16px}
        button{width:100%;background:#1a2e54;border:0;color:#6b9cf4;padding:12px;border-radius:8px;cursor:pointer}
    </style>
</head>
<body>
<div class="card">
    <h3 style="color:#f0f4ff; margin-bottom:20px;">Crear nueva contraseña</h3>
    <form th:action="@{/resetear-contrasena}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <input type="password" name="newPassword" placeholder="Nueva contraseña" required>
        <button type="submit">Guardar contraseña</button>
    </form>
</div>
</body>
</html>

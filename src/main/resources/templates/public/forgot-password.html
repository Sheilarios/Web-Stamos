<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAMOS · Restablecer contraseña</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#080b11;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .card{background:#0f1219;border:0.5px solid #1a2535;border-radius:16px;max-width:460px;width:100%;padding:36px 32px;box-shadow:0 15px 35px rgba(0,0,0,0.4)}
        .logo{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#f0f4ff;text-align:center;margin-bottom:8px}
        .logo span{color:#3d72d4}
        .title{font-size:22px;font-weight:600;margin-top:16px;color:#e0e8f4;text-align:center}
        .sub{font-size:13px;color:#4a5a72;text-align:center;margin:8px 0 24px}
        .input-group{margin-bottom:20px}
        label{font-size:11px;color:#4a5a72;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
        input{width:100%;background:#0d1220;border:0.5px solid #1a2030;border-radius:8px;padding:12px 14px;color:#c4cfe8;font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
        input:focus{border-color:#2a4878}
        button{width:100%;background:#1a2e54;border:0.5px solid #2a4878;color:#6b9cf4;padding:12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;margin-top:8px}
        .back-link{text-align:center;margin-top:20px;font-size:12px}
        .back-link a{color:#4a72a4;text-decoration:none}
        .alert{background:#0d1828;border:0.5px solid #1a2e48;border-radius:8px;padding:10px;margin-bottom:20px;font-size:12px;color:#4a82d4}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">STAMOS<span>.</span></div>
    <div class="title">¿Olvidaste tu contraseña?</div>
    <div class="sub">Te enviaremos un enlace para restablecerla</div>

    <div th:if="${success}" class="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert" style="color:#c04a4a" th:text="${error}"></div>

    <form th:action="@{/olvide-contrasena}" method="post">
        <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" name="email" required placeholder="tu@empresa.com">
        </div>
        <button type="submit">Enviar enlace de restablecimiento</button>
    </form>
    <div class="back-link"><a th:href="@{/login}">← Volver al inicio de sesión</a></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAMOS · Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');

        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #F8F8F8;
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #000000;
            padding: 32px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            border-right: none;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #F5C400; border-radius: 4px; }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .sidebar-brand h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .sidebar-brand h2 span {
            color: #F5C400;
        }

        .sidebar-brand small {
            display: block;
            font-size: 11px;
            color: #8A8A8A;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 2px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: #C0C0C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
        }

        .sidebar-menu li a i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .sidebar-menu li a:hover {
            background: rgba(245, 196, 0, 0.10);
            color: #FFFFFF;
        }

        .sidebar-menu li a.active {
            background: #F5C400;
            color: #000000;
            font-weight: 600;
        }

        .sidebar-menu li a.active i {
            color: #000000;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #EF4444;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .sidebar-footer a:hover {
            background: rgba(239, 68, 68, 0.10);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px 40px;
            min-height: 100vh;
            background: #F8F8F8;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: #F5C400;
            font-size: 28px;
        }

        .user-info {
            background: #FFFFFF;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #E8E8E8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1A1F2E;
        }

        .user-info i {
            color: #F5C400;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-primary {
            background: var(--yellow);
            color: var(--text);
        }

        .btn-primary:hover {
            background: var(--yellow-mid);
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-warning {
            background: #FEF3C7;
            color: #D97706;
        }

        .btn-warning:hover {
            background: #FDE68A;
        }

        .btn-danger {
            background: var(--red-light);
            color: var(--red);
        }

        .btn-danger:hover {
            background: #FECACA;
        }

        .btn-success {
            background: var(--green-light);
            color: var(--green);
        }

        .btn-success:hover {
            background: #A7F3D0;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1px solid #E8E8E8;
            border-radius: 10px;
            padding: 4px 12px;
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search-box i {
            color: #8A8A8A;
            font-size: 18px;
        }

        .search-box input {
            border: none;
            padding: 8px 10px;
            font-size: 14px;
            background: transparent;
            width: 100%;
            outline: none;
            color: #1A1F2E;
        }

        .section {
            background: #FFFFFF;
            border: 1px solid #E8E8E8;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            padding: 18px 24px;
            border-bottom: 1px solid #E8E8E8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #000000;
        }

        .section-title i {
            color: #F5C400;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            background: #FFFBE6;
            color: #9A7500;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #E0C84A;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #E8E8E8;
            color: #5A6478;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-success {
            background: #EBF7F0;
            color: #1A7040;
        }

        .badge-danger {
            background: #FFF0EE;
            color: #C0392B;
        }

        .rol-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .rol-admin { background: #FEE2E2; color: #DC2626; }
        .rol-vendedor { background: #DBEAFE; color: #2563EB; }
        .rol-disenador { background: #EDE9FE; color: #7C3AED; }
        .rol-produccion { background: #FEF3C7; color: #D97706; }
        .rol-soporte { background: #D1FAE5; color: #059669; }
        .rol-cliente { background: #F3F4F6; color: #6B7280; }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #8A8A8A;
        }

        .empty-message i {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-danger {
            background: #FFF0EE;
            border: 1px solid #FECACA;
            color: #C0392B;
        }

        .alert-success {
            background: #EBF7F0;
            border: 1px solid #A7F3D0;
            color: #1A7040;
        }

        .pagination {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 16px;
            flex-wrap: wrap;
        }

        .pagination a, .pagination span {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            color: #5A6478;
            background: #F5F6F8;
            border: 1px solid #E2E6EA;
        }

        .pagination .active {
            background: #F5C400;
            color: #1A1F2E;
            border-color: #F5C400;
            font-weight: 600;
        }

        .pagination a:hover {
            background: #FFFBE6;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 72px;
                padding: 16px 0;
            }
            .sidebar-brand h2, .sidebar-brand small, .sidebar-menu li a span {
                display: none;
            }
            .sidebar-menu li a {
                justify-content: center;
                padding: 12px;
            }
            .sidebar-menu li a i {
                font-size: 22px;
                width: auto;
            }
            .sidebar-footer a span {
                display: none;
            }
            .sidebar-footer a {
                justify-content: center;
            }
            .main-content {
                margin-left: 72px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid #222;
                flex-wrap: wrap;
            }
            .sidebar-brand {
                padding: 0;
                border-bottom: none;
                margin-bottom: 0;
                flex: 1;
            }
            .sidebar-brand h2 {
                font-size: 20px;
            }
            .sidebar-brand small {
                display: block;
                font-size: 10px;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0;
                flex: 1;
            }
            .sidebar-menu li {
                margin-bottom: 0;
            }
            .sidebar-menu li a {
                padding: 6px 10px;
                font-size: 12px;
            }
            .sidebar-menu li a i {
                font-size: 16px;
            }
            .sidebar-menu li a span {
                display: inline;
                font-size: 11px;
            }
            .sidebar-footer {
                border-top: none;
                padding: 0;
                margin: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .page-title {
                font-size: 22px;
            }
            .toolbar {
                flex-direction: column;
            }
            .search-box {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>STAMOS<span>.</span></h2>
            <small>Administración</small>
        </div>

        <ul class="sidebar-menu">
            <li th:each="item : ${menuItems}">
                <a th:href="${item.url}" 
                   th:classappend="${#strings.equalsIgnoreCase(currentPath, item.url)} ? 'active' : ''">
                    <i th:class="${item.icon}"></i>
                    <span th:text="${item.label}"></span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <i class="ti ti-logout"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main class="main-content">

        <div class="header">
            <div class="page-title">
                <i class="ti ti-user-cog"></i>
                <span>Gestión de Usuarios</span>
            </div>
            <div class="user-info">
                <i class="ti ti-user-circle"></i>
                <span th:text="${username}">Administrador</span>
                <span style="color:#8A8A8A;font-size:11px;" th:text="${rol}">Admin</span>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <div class="toolbar">
            <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">
                <i class="ti ti-plus"></i> Nuevo Usuario
            </a>
            <div class="search-box">
                <i class="ti ti-search"></i>
                <input type="text" placeholder="Buscar usuario..." 
                       id="searchInput" 
                       th:value="${search}"
                       onkeyup="if(event.key === 'Enter') this.form.submit()">
            </div>
            <button class="btn btn-sm btn-primary" 
                    onclick="window.location.href='/admin/usuarios?search='+document.getElementById('searchInput').value">
                Buscar
            </button>
            <a th:href="@{/admin/usuarios}" class="btn btn-sm btn-warning">Limpiar</a>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title">
                    <i class="ti ti-users"></i> 
                    <span>Usuarios del sistema</span>
                    <span style="font-size:13px;font-weight:400;color:#8A8A8A;" 
                          th:text="'(' + ${totalUsuarios} + ' registrados)'">(0)</span>
                </div>
            </div>
            <div class="table-wrapper">
                <table th:if="${usuarios != null && !usuarios.isEmpty()}">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Último acceso</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.idUsuario}">1</td>
                            <td th:text="${u.nombreCompleto}">—</td>
                            <td>
                                <span th:text="${u.email}" style="font-size:12px;color:#8A8A8A;">—</span>
                            </td>
                            <td>
                                <span class="rol-badge" 
                                      th:classappend="${u.nombreRol == 'Administrador'} ? 'rol-admin' :
                                                      (u.nombreRol == 'Vendedor' ? 'rol-vendedor' :
                                                      (u.nombreRol == 'Diseñador' ? 'rol-disenador' :
                                                      (u.nombreRol == 'Producción' ? 'rol-produccion' :
                                                      (u.nombreRol == 'Soporte Técnico' ? 'rol-soporte' :
                                                      'rol-cliente'))))"
                                      th:text="${u.nombreRolLegible ?: u.nombreRol}">—</span>
                            </td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${u.activo} ? 'badge-success' : 'badge-danger'"
                                      th:text="${u.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                            </td>
                            <td th:text="${u.ultimoAccesoFormateado ?: 'Nunca'}">—</td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{/admin/usuarios/editar/{id}(id=${u.idUsuario})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="ti ti-edit"></i>
                                    </a>
                                    <a th:if="${u.activo}" 
                                       th:href="@{/admin/usuarios/desactivar/{id}(id=${u.idUsuario})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('¿Desactivar este usuario?')">
                                        <i class="ti ti-user-x"></i>
                                    </a>
                                    <a th:unless="${u.activo}" 
                                       th:href="@{/admin/usuarios/activar/{id}(id=${u.idUsuario})}" 
                                       class="btn btn-sm btn-success"
                                       onclick="return confirm('¿Activar este usuario?')">
                                        <i class="ti ti-user-check"></i>
                                    </a>
                                    <a th:href="@{/admin/usuarios/eliminar/{id}(id=${u.idUsuario})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('¿Eliminar permanentemente este usuario?')">
                                        <i class="ti ti-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${usuarios == null || usuarios.isEmpty()}" class="empty-message">
                    <i class="ti ti-user-off"></i>
                    <p>No hay usuarios registrados.</p>
                    <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary" style="margin-top:12px;">
                        <i class="ti ti-plus"></i> Crear primer usuario
                    </a>
                </div>
            </div>

            <div th:if="${totalPages != null && totalPages > 1}" class="pagination">
                <a th:if="${currentPage > 0}" 
                   th:href="@{/admin/usuarios(page=${currentPage - 1}, size=${size}, search=${search})}">
                    <i class="ti ti-chevron-left"></i>
                </a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i != currentPage}" 
                       th:href="@{/admin/usuarios(page=${i}, size=${size}, search=${search})}"
                       th:text="${i + 1}">1</a>
                    <span th:if="${i == currentPage}" 
                          class="active" 
                          th:text="${i + 1}">1</span>
                </span>
                <a th:if="${currentPage < totalPages - 1}" 
                   th:href="@{/admin/usuarios(page=${currentPage + 1}, size=${size}, search=${search})}">
                    <i class="ti ti-chevron-right"></i>
                </a>
            </div>
            <div style="padding:8px 24px 16px;font-size:12px;color:#8A8A8A;text-align:center;" 
                 th:if="${totalItems != null}" 
                 th:text="'Mostrando ' + ${usuarios != null ? usuarios.size() : 0} + ' de ' + ${totalItems} + ' usuarios'">
            </div>
        </div>

        <div style="text-align:center;padding:12px;font-size:12px;color:#8A8A8A;border-top:1px solid #E8E8E8;margin-top:12px;">
            <span th:text="${fechaActual}"></span>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.sidebar-menu li a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '#') {
                    link.classList.remove('active');
                    if (currentPath === href || (href !== '/admin/dashboard' && currentPath.startsWith(href))) {
                        link.classList.add('active');
                    }
                }
            });
        });

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                window.location.href = '/admin/usuarios?search=' + encodeURIComponent(this.value);
            }
        });
    </script>

</body>
</html>

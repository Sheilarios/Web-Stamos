<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes · STAMOS Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --blue: #1A56DB;
            --blue-light: #E8F0FE;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .page-title i {
            color: var(--yellow-dark);
            font-size: 28px;
        }
        
        .page-title .count {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-3);
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .search-bar {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        
        .search-input i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 16px;
        }
        
        .search-input input {
            width: 100%;
            padding: 10px 10px 10px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: all 0.2s;
        }
        
        .search-input input:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
        }
        
        .filter-group i {
            color: var(--text-3);
            font-size: 16px;
        }
        
        .filter-group select {
            border: none;
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            text-align: left;
            padding: 14px 16px;
            background: var(--yellow-light);
            color: var(--yellow-dark);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--yellow-border);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-2);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover td {
            background: var(--yellow-light);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-activo {
            background: var(--green-light);
            color: var(--green);
        }
        
        .status-inactivo {
            background: var(--red-light);
            color: var(--red);
        }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-icon:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .btn-icon.verde:hover {
            border-color: var(--green);
            color: var(--green);
        }
        
        .btn-icon.rojo:hover {
            border-color: var(--red);
            color: var(--red);
        }
        
        .btn-icon.azul:hover {
            border-color: var(--blue);
            color: var(--blue);
        }
        
        .empty-message {
            text-align: center;
            padding: 48px;
            color: var(--text-3);
        }
        
        .empty-message i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-message p {
            font-size: 14px;
        }
        
        .pagination {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .pagination-info {
            font-size: 13px;
            color: var(--text-3);
        }
        
        .pagination-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .page-link {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-2);
            font-size: 13px;
            transition: all 0.15s;
        }
        
        .page-link:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .page-link.active {
            background: var(--yellow);
            border-color: var(--yellow);
            color: #2A1800;
            font-weight: 600;
        }
        
        .page-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        
        .alert-success {
            background: var(--green-light);
            border: 1px solid #A7F3D0;
            color: var(--green);
        }
        
        .alert-danger {
            background: var(--red-light);
            border: 1px solid #FECACA;
            color: var(--red);
        }
        
        @media (max-width: 768px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            .search-bar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; }
            .filter-group select { width: 100%; }
            th, td { padding: 10px 12px; font-size: 12px; }
            .action-buttons { flex-direction: column; align-items: stretch; }
            .btn-icon { justify-content: center; }
            .pagination { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="page-title">
            <i class="ti ti-users"></i>
            <span>Gestión de Clientes</span>
            <span class="count" th:text="'(' + ${totalItems} + ')'">(0)</span>
        </div>
        <a th:href="@{/admin/clientes/nuevo}" class="btn-primary">
            <i class="ti ti-plus"></i> Nuevo Cliente
        </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/clientes}" method="get" class="search-bar">
        <div class="search-input">
            <i class="ti ti-search"></i>
            <input type="text" name="search" th:value="${search}" placeholder="Buscar por nombre, RUC o teléfono...">
        </div>
        <div class="filter-group">
            <i class="ti ti-filter"></i>
            <select name="estado" onchange="this.form.submit()">
                <option value="">Todos los estados</option>
                <option value="Activo" th:selected="${estado == 'Activo'}">Activos</option>
                <option value="Deshabilitado" th:selected="${estado == 'Deshabilitado'}">Deshabilitados</option>
            </select>
        </div>
        <button type="submit" class="btn-secondary">
            <i class="ti ti-search"></i> Buscar
        </button>
        <a th:href="@{/admin/clientes}" class="btn-secondary" th:if="${search != null or estado != null}">
            <i class="ti ti-refresh"></i> Limpiar
        </a>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre / Razón Social</th>
                    <th>RUC</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.idCliente}">—</td>
                    <td th:text="${cliente.nombreRazonSocial}">—</td>
                    <td th:text="${cliente.ruc != null ? cliente.ruc : '-'}">—</td>
                    <td th:text="${cliente.telefono}">—</td>
                    <td th:text="${cliente.email}">—</td>
                    <td>
                        <span th:text="${cliente.tipoPersona == 'Natural' ? 'Persona Natural' : 'Persona Jurídica'}">—</span>
                    </td>
                    <td>
                        <span class="status-badge" 
                              th:classappend="${cliente.estado == 'Activo'} ? 'status-activo' : 'status-inactivo'"
                              th:text="${cliente.estado}">—</span>
                    </td>
                    <td class="action-buttons">
                        <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.idCliente})}" class="btn-icon azul">
                            <i class="ti ti-edit"></i> Editar
                        </a>
                        <a th:href="@{/admin/clientes/historial/{id}(id=${cliente.idCliente})}" class="btn-icon">
                            <i class="ti ti-history"></i> Historial
                        </a>
                        <form th:action="@{/admin/clientes/deshabilitar/{id}(id=${cliente.idCliente})}" method="post" style="display:inline;" 
                              th:if="${cliente.estado == 'Activo'}">
                            <button type="submit" class="btn-icon rojo" onclick="return confirm('¿Deshabilitar este cliente?');">
                                <i class="ti ti-user-x"></i> Deshabilitar
                            </button>
                        </form>
                        <form th:action="@{/admin/clientes/habilitar/{id}(id=${cliente.idCliente})}" method="post" style="display:inline;" 
                              th:if="${cliente.estado == 'Deshabilitado'}">
                            <button type="submit" class="btn-icon verde" onclick="return confirm('¿Habilitar este cliente?');">
                                <i class="ti ti-user-check"></i> Habilitar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${clientes == null || clientes.isEmpty()}">
                    <td colspan="8">
                        <div class="empty-message">
                            <i class="ti ti-users-off"></i>
                            <p>No hay clientes registrados.</p>
                            <a th:href="@{/admin/clientes/nuevo}" class="btn-primary" style="margin-top: 16px;">
                                <i class="ti ti-plus"></i> Registrar primer cliente
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${clientes != null && !clientes.isEmpty()}">
        <div class="pagination-info">
            Mostrando <span th:text="${#lists.size(clientes)}">0</span> de <span th:text="${totalItems}">0</span> clientes
        </div>
        <div class="pagination-buttons">
            <a th:href="@{/admin/clientes(page=${currentPage - 1}, search=${search}, estado=${estado})}" 
               class="page-link" 
               th:classappend="${currentPage == 0} ? 'disabled' : ''">
                Anterior
            </a>
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
               th:href="@{/admin/clientes(page=${i}, search=${search}, estado=${estado})}" 
               class="page-link" 
               th:classappend="${i == currentPage} ? 'active' : ''"
               th:text="${i + 1}">
                1
            </a>
            <a th:href="@{/admin/clientes(page=${currentPage + 1}, search=${search}, estado=${estado})}" 
               class="page-link" 
               th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                Siguiente
            </a>
        </div>
    </div>

</div>

</body>
</html>

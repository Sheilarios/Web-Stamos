<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes · STAMOS Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');

        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --blue: #1A56DB;
            --blue-light: #E8F0FE;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #F8F8F8;
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #000000;
            padding: 32px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            border-right: none;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #F5C400; border-radius: 4px; }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .sidebar-brand h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .sidebar-brand h2 span {
            color: #F5C400;
        }

        .sidebar-brand small {
            display: block;
            font-size: 11px;
            color: #8A8A8A;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 2px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: #C0C0C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
        }

        .sidebar-menu li a i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .sidebar-menu li a:hover {
            background: rgba(245, 196, 0, 0.10);
            color: #FFFFFF;
        }

        .sidebar-menu li a.active {
            background: #F5C400;
            color: #000000;
            font-weight: 600;
        }

        .sidebar-menu li a.active i {
            color: #000000;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #EF4444;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .sidebar-footer a:hover {
            background: rgba(239, 68, 68, 0.10);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px 40px;
            min-height: 100vh;
            background: #F8F8F8;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: #F5C400;
            font-size: 28px;
        }

        .page-title .count {
            font-size: 14px;
            font-weight: 400;
            color: #8A8A8A;
            font-family: 'DM Sans', sans-serif;
        }

        .user-info {
            background: #FFFFFF;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #E8E8E8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1A1F2E;
        }

        .user-info i {
            color: #F5C400;
        }

        .btn-primary {
            background: #F5C400;
            border: none;
            color: #2A1800;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .btn-primary:hover {
            background: #FFE566;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #E2E6EA;
            color: #5A6478;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: #F5C400;
            color: #9A7500;
        }

        .search-bar {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9BA5B7;
            font-size: 16px;
        }

        .search-input input {
            width: 100%;
            padding: 10px 10px 10px 42px;
            border: 1px solid #E2E6EA;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: all 0.2s;
            background: #FFFFFF;
            color: #1A1F2E;
        }

        .search-input input:focus {
            border-color: #F5C400;
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            border: 1px solid #E2E6EA;
            border-radius: 10px;
            padding: 0 12px;
        }

        .filter-group i {
            color: #9BA5B7;
            font-size: 16px;
        }

        .filter-group select {
            border: none;
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
            color: #1A1F2E;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #E8E8E8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            background: #FFFBE6;
            color: #9A7500;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #E0C84A;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #E8E8E8;
            color: #5A6478;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #FFFBE6;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-activo {
            background: #EBF7F0;
            color: #1A7040;
        }

        .status-inactivo {
            background: #FFF0EE;
            color: #C0392B;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid #E2E6EA;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            color: #5A6478;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-icon:hover {
            border-color: #F5C400;
            color: #9A7500;
        }

        .btn-icon.verde:hover {
            border-color: #1A7040;
            color: #1A7040;
        }

        .btn-icon.rojo:hover {
            border-color: #C0392B;
            color: #C0392B;
        }

        .btn-icon.azul:hover {
            border-color: #1A56DB;
            color: #1A56DB;
        }

        .empty-message {
            text-align: center;
            padding: 48px;
            color: #8A8A8A;
        }

        .empty-message i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-message p {
            font-size: 14px;
        }

        .pagination {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .pagination-info {
            font-size: 13px;
            color: #8A8A8A;
        }

        .pagination-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-link {
            padding: 6px 12px;
            border: 1px solid #E2E6EA;
            border-radius: 6px;
            text-decoration: none;
            color: #5A6478;
            font-size: 13px;
            transition: all 0.15s;
            background: #F5F6F8;
        }

        .page-link:hover {
            border-color: #F5C400;
            color: #9A7500;
            background: #FFFBE6;
        }

        .page-link.active {
            background: #F5C400;
            border-color: #F5C400;
            color: #2A1800;
            font-weight: 600;
        }

        .page-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .alert-success {
            background: #EBF7F0;
            border: 1px solid #A7F3D0;
            color: #1A7040;
        }

        .alert-danger {
            background: #FFF0EE;
            border: 1px solid #FECACA;
            color: #C0392B;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 72px;
                padding: 16px 0;
            }
            .sidebar-brand h2, .sidebar-brand small, .sidebar-menu li a span {
                display: none;
            }
            .sidebar-menu li a {
                justify-content: center;
                padding: 12px;
            }
            .sidebar-menu li a i {
                font-size: 22px;
                width: auto;
            }
            .sidebar-footer a span {
                display: none;
            }
            .sidebar-footer a {
                justify-content: center;
            }
            .main-content {
                margin-left: 72px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid #222;
                flex-wrap: wrap;
            }
            .sidebar-brand {
                padding: 0;
                border-bottom: none;
                margin-bottom: 0;
                flex: 1;
            }
            .sidebar-brand h2 {
                font-size: 20px;
            }
            .sidebar-brand small {
                display: block;
                font-size: 10px;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0;
                flex: 1;
            }
            .sidebar-menu li {
                margin-bottom: 0;
            }
            .sidebar-menu li a {
                padding: 6px 10px;
                font-size: 12px;
            }
            .sidebar-menu li a i {
                font-size: 16px;
            }
            .sidebar-menu li a span {
                display: inline;
                font-size: 11px;
            }
            .sidebar-footer {
                border-top: none;
                padding: 0;
                margin: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .page-title {
                font-size: 22px;
            }
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                width: 100%;
            }
            .filter-group select {
                width: 100%;
            }
            th, td {
                padding: 10px 12px;
                font-size: 12px;
            }
            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-icon {
                justify-content: center;
            }
            .pagination {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>STAMOS<span>.</span></h2>
            <small>Administración</small>
        </div>

        <ul class="sidebar-menu">
            <li th:each="item : ${menuItems}">
                <a th:href="${item.url}" 
                   th:classappend="${#strings.equalsIgnoreCase(currentPath, item.url)} ? 'active' : ''">
                    <i th:class="${item.icon}"></i>
                    <span th:text="${item.label}"></span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main class="main-content">

        <div class="header">
            <div class="page-title">
                <i class="bi bi-people"></i>
                <span>Gestión de Clientes</span>
                <span class="count" th:text="'(' + ${totalItems} + ')'">(0)</span>
            </div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${username}">Administrador</span>
                <span style="color:#8A8A8A;font-size:11px;" th:text="${rol}">Admin</span>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/admin/clientes}" method="get" class="search-bar">
            <div class="search-input">
                <i class="bi bi-search"></i>
                <input type="text" name="search" th:value="${search}" placeholder="Buscar por nombre, RUC o teléfono...">
            </div>
            <div class="filter-group">
                <i class="bi bi-funnel"></i>
                <select name="estado" onchange="this.form.submit()">
                    <option value="">Todos los estados</option>
                    <option value="Activo" th:selected="${estado == 'Activo'}">Activos</option>
                    <option value="Deshabilitado" th:selected="${estado == 'Deshabilitado'}">Deshabilitados</option>
                </select>
            </div>
            <button type="submit" class="btn-secondary">
                <i class="bi bi-search"></i> Buscar
            </button>
            <a th:href="@{/admin/clientes}" class="btn-secondary" th:if="${search != null or estado != null}">
                <i class="bi bi-arrow-repeat"></i> Limpiar
            </a>
            <a th:href="@{/admin/clientes/nuevo}" class="btn-primary">
                <i class="bi bi-plus-lg"></i> Nuevo Cliente
            </a>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre / Razón Social</th>
                        <th>RUC</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.idCliente}">—</td>
                        <td th:text="${cliente.nombreRazonSocial}">—</td>
                        <td th:text="${cliente.ruc != null ? cliente.ruc : '-'}">—</td>
                        <td th:text="${cliente.telefono}">—</td>
                        <td th:text="${cliente.email}">—</td>
                        <td>
                            <span th:text="${cliente.tipoPersona == 'Natural' ? 'Persona Natural' : 'Persona Jurídica'}">—</span>
                        </td>
                        <td>
                            <span class="status-badge" 
                                  th:classappend="${cliente.estado == 'Activo'} ? 'status-activo' : 'status-inactivo'"
                                  th:text="${cliente.estado}">—</span>
                        </td>
                        <td class="action-buttons">
                            <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.idCliente})}" class="btn-icon azul">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/admin/clientes/historial/{id}(id=${cliente.idCliente})}" class="btn-icon">
                                <i class="bi bi-clock-history"></i>
                            </a>
                            <form th:action="@{/admin/clientes/deshabilitar/{id}(id=${cliente.idCliente})}" method="post" style="display:inline;" 
                                  th:if="${cliente.estado == 'Activo'}">
                                <button type="submit" class="btn-icon rojo" onclick="return confirm('¿Deshabilitar este cliente?');">
                                    <i class="bi bi-person-x"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/clientes/habilitar/{id}(id=${cliente.idCliente})}" method="post" style="display:inline;" 
                                  th:if="${cliente.estado == 'Deshabilitado'}">
                                <button type="submit" class="btn-icon verde" onclick="return confirm('¿Habilitar este cliente?');">
                                    <i class="bi bi-person-check"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${clientes == null || clientes.isEmpty()}">
                        <td colspan="8">
                            <div class="empty-message">
                                <i class="bi bi-people-slash"></i>
                                <p>No hay clientes registrados.</p>
                                <a th:href="@{/admin/clientes/nuevo}" class="btn-primary" style="margin-top: 16px;">
                                    <i class="bi bi-plus-lg"></i> Registrar primer cliente
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${clientes != null && !clientes.isEmpty()}">
            <div class="pagination-info">
                Mostrando <span th:text="${#lists.size(clientes)}">0</span> de <span th:text="${totalItems}">0</span> clientes
            </div>
            <div class="pagination-buttons">
                <a th:href="@{/admin/clientes(page=${currentPage - 1}, search=${search}, estado=${estado})}" 
                   class="page-link" 
                   th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    <i class="bi bi-chevron-left"></i> Anterior
                </a>
                <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                   th:href="@{/admin/clientes(page=${i}, search=${search}, estado=${estado})}" 
                   class="page-link" 
                   th:classappend="${i == currentPage} ? 'active' : ''"
                   th:text="${i + 1}">
                    1
                </a>
                <a th:href="@{/admin/clientes(page=${currentPage + 1}, search=${search}, estado=${estado})}" 
                   class="page-link" 
                   th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                    <i class="bi bi-chevron-right"></i> Siguiente
                </a>
            </div>
        </div>

        <div style="text-align:center;padding:12px;font-size:12px;color:#8A8A8A;border-top:1px solid #E8E8E8;margin-top:12px;">
            <span th:text="${fechaActual}"></span>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.sidebar-menu li a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '#') {
                    link.classList.remove('active');
                    if (currentPath === href || (href !== '/admin/dashboard' && currentPath.startsWith(href))) {
                        link.classList.add('active');
                    }
                }
            });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloFormulario} + ' · STAMOS Administración'">STAMOS · Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .header i {
            font-size: 28px;
            color: var(--yellow-dark);
        }
        
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 16px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            background: white;
            outline: none;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            padding: 12px;
        }
        
        textarea + i {
            align-items: flex-start;
            top: 16px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }
        
        .checkbox-group input {
            width: auto;
            padding: 0;
            margin: 0;
        }
        
        .checkbox-group label {
            margin: 0;
            text-transform: none;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        @media (max-width: 640px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="ti ti-user-plus"></i>
        <h1 th:text="${tituloFormulario}">Formulario Cliente</h1>
    </div>

    <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post">
        <!-- Campo oculto para el ID (solo en edición) -->
        <input type="hidden" th:field="*{codCli}">

        <div class="form-row">
            <div class="form-group">
                <label for="razonCli">Razón Social / Nombre *</label>
                <div class="input-wrapper">
                    <i class="ti ti-building"></i>
                    <input type="text" id="razonCli" th:field="*{razonCli}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="rucCli">RUC (opcional)</label>
                <div class="input-wrapper">
                    <i class="ti ti-id"></i>
                    <input type="text" id="rucCli" th:field="*{rucCli}" maxlength="11" placeholder="20XXXXXXXXX">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="correoCli">Correo electrónico *</label>
                <div class="input-wrapper">
                    <i class="ti ti-mail"></i>
                    <input type="email" id="correoCli" th:field="*{correoCli}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="telefCli">Teléfono *</label>
                <div class="input-wrapper">
                    <i class="ti ti-phone"></i>
                    <input type="text" id="telefCli" th:field="*{telefCli}" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="dirCli">Dirección</label>
            <div class="input-wrapper">
                <i class="ti ti-map-pin"></i>
                <input type="text" id="dirCli" th:field="*{dirCli}" placeholder="Calle, número, referencia...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="tipoCli">Tipo de cliente</label>
                <div class="input-wrapper">
                    <i class="ti ti-users"></i>
                    <select id="tipoCli" th:field="*{tipoCli}">
                        <option value="">Seleccionar</option>
                        <option value="NATURAL">Persona Natural</option>
                        <option value="EMPRESA">Empresa</option>
                    </select>
                </div>
            </div>
            <div class="form-group" th:if="${cliente.codCli != null}">
                <label>Estado</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="activo" th:field="*{activo}">
                    <label for="activo">Cliente activo</label>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/admin/clientes}" class="btn-secondary">
                <i class="ti ti-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary">
                <i class="ti ti-device-floppy"></i> <span th:text="${textoBoton}">Guardar</span>
            </button>
        </div>
    </form>
</div>

</body>
</html>

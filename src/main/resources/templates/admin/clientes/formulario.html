<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' · STAMOS Administración'">STAMOS · Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');

        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #F8F8F8;
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #000000;
            padding: 32px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            border-right: none;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #F5C400; border-radius: 4px; }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .sidebar-brand h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .sidebar-brand h2 span {
            color: #F5C400;
        }

        .sidebar-brand small {
            display: block;
            font-size: 11px;
            color: #8A8A8A;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 2px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: #C0C0C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
        }

        .sidebar-menu li a i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .sidebar-menu li a:hover {
            background: rgba(245, 196, 0, 0.10);
            color: #FFFFFF;
        }

        .sidebar-menu li a.active {
            background: #F5C400;
            color: #000000;
            font-weight: 600;
        }

        .sidebar-menu li a.active i {
            color: #000000;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #EF4444;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .sidebar-footer a:hover {
            background: rgba(239, 68, 68, 0.10);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px 40px;
            min-height: 100vh;
            background: #F8F8F8;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: #F5C400;
            font-size: 28px;
        }

        .user-info {
            background: #FFFFFF;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #E8E8E8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1A1F2E;
        }

        .user-info i {
            color: #F5C400;
        }

        .form-container {
            max-width: 800px;
            background: #FFFFFF;
            border: 1px solid #E8E8E8;
            border-radius: 16px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: #5A6478;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9BA5B7;
            font-size: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #E2E6EA;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            background: white;
            outline: none;
            color: #1A1F2E;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #F5C400;
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            padding: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .checkbox-group input {
            width: auto;
            padding: 0;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
            text-transform: none;
            font-size: 13px;
            font-weight: 500;
            color: #1A1F2E;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #E2E6EA;
        }

        .btn-primary {
            background: #F5C400;
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .btn-primary:hover {
            background: #FFE566;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #E2E6EA;
            color: #5A6478;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }

        .btn-secondary:hover {
            border-color: #F5C400;
            color: #9A7500;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-danger {
            background: #FFF0EE;
            border: 1px solid #FECACA;
            color: #C0392B;
        }

        .alert-success {
            background: #EBF7F0;
            border: 1px solid #A7F3D0;
            color: #1A7040;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 72px;
                padding: 16px 0;
            }
            .sidebar-brand h2, .sidebar-brand small, .sidebar-menu li a span {
                display: none;
            }
            .sidebar-menu li a {
                justify-content: center;
                padding: 12px;
            }
            .sidebar-menu li a i {
                font-size: 22px;
                width: auto;
            }
            .sidebar-footer a span {
                display: none;
            }
            .sidebar-footer a {
                justify-content: center;
            }
            .main-content {
                margin-left: 72px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid #222;
                flex-wrap: wrap;
            }
            .sidebar-brand {
                padding: 0;
                border-bottom: none;
                margin-bottom: 0;
                flex: 1;
            }
            .sidebar-brand h2 {
                font-size: 20px;
            }
            .sidebar-brand small {
                display: block;
                font-size: 10px;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0;
                flex: 1;
            }
            .sidebar-menu li {
                margin-bottom: 0;
            }
            .sidebar-menu li a {
                padding: 6px 10px;
                font-size: 12px;
            }
            .sidebar-menu li a i {
                font-size: 16px;
            }
            .sidebar-menu li a span {
                display: inline;
                font-size: 11px;
            }
            .sidebar-footer {
                border-top: none;
                padding: 0;
                margin: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .page-title {
                font-size: 22px;
            }
            .form-container {
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .form-actions {
                flex-wrap: wrap;
            }
            .form-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>STAMOS<span>.</span></h2>
            <small>Administración</small>
        </div>

        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}"><i class="ti ti-layout-dashboard"></i><span>Dashboard</span></a></li>
            <li><a th:href="@{/admin/clientes}" class="active"><i class="ti ti-users"></i><span>Clientes</span></a></li>
            <li><a th:href="@{/admin/cotizaciones}"><i class="ti ti-file-invoice"></i><span>Cotizaciones</span></a></li>
            <li><a th:href="@{/admin/pagos}"><i class="ti ti-credit-card"></i><span>Pagos</span></a></li>
            <li><a th:href="@{/admin/inventario}"><i class="ti ti-box"></i><span>Inventario</span></a></li>
            <li><a th:href="@{/admin/proyectos}"><i class="ti ti-folder-open"></i><span>Proyectos</span></a></li>
            <li><a th:href="@{/admin/configuracion}"><i class="ti ti-settings"></i><span>Configuración</span></a></li>
            <li><a th:href="@{/admin/usuarios}"><i class="ti ti-user-cog"></i><span>Usuarios</span></a></li>
            <li><a th:href="@{/admin/reportes}"><i class="ti ti-file-pdf"></i><span>Reportes</span></a></li>
        </ul>

        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <i class="ti ti-logout"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main class="main-content">

        <div class="header">
            <div class="page-title">
                <i th:if="${accion == 'crear'}" class="ti ti-user-plus"></i>
                <i th:unless="${accion == 'crear'}" class="ti ti-user-edit"></i>
                <span th:text="${titulo}">Formulario Cliente</span>
            </div>
            <div class="user-info">
                <i class="ti ti-user-circle"></i>
                <span th:text="${username}">Administrador</span>
                <span style="color:#8A8A8A;font-size:11px;" th:text="${rol}">Admin</span>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <div class="form-container">
            <form th:action="@{${accion == 'crear' ? '/admin/clientes/crear' : '/admin/clientes/actualizar/' + cliente.idCliente}}" 
                  th:object="${cliente}" method="post">

                <input type="hidden" th:field="*{idCliente}">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombreRazonSocial">Razón Social / Nombre *</label>
                        <div class="input-wrapper">
                            <i class="ti ti-building"></i>
                            <input type="text" id="nombreRazonSocial" th:field="*{nombreRazonSocial}" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="ruc">RUC</label>
                        <div class="input-wrapper">
                            <i class="ti ti-barcode"></i>
                            <input type="text" id="ruc" th:field="*{ruc}" maxlength="11" placeholder="20XXXXXXXXX">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Correo electrónico *</label>
                        <div class="input-wrapper">
                            <i class="ti ti-mail"></i>
                            <input type="email" id="email" th:field="*{email}" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono *</label>
                        <div class="input-wrapper">
                            <i class="ti ti-phone"></i>
                            <input type="text" id="telefono" th:field="*{telefono}" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <div class="input-wrapper">
                        <i class="ti ti-map-pin"></i>
                        <input type="text" id="direccion" th:field="*{direccion}" placeholder="Calle, número, referencia...">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tipoPersona">Tipo de cliente *</label>
                        <div class="input-wrapper">
                            <i class="ti ti-people"></i>
                            <select id="tipoPersona" th:field="*{tipoPersona}" required>
                                <option value="">Seleccionar</option>
                                <option value="Natural">Persona Natural</option>
                                <option value="Juridica">Empresa / Persona Jurídica</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" th:if="${cliente.idCliente != null}">
                        <label>Estado</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="activo" name="estado" value="Activo" 
                                   th:checked="${cliente.estado == 'Activo'}">
                            <label for="activo">Cliente activo</label>
                        </div>
                    </div>
                </div>

                <div class="form-group" th:if="${accion == 'crear'}">
                    <label for="password">Contraseña *</label>
                    <div class="input-wrapper">
                        <i class="ti ti-lock"></i>
                        <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div class="form-group" th:if="${accion == 'crear'}">
                    <label for="confirmPassword">Confirmar contraseña *</label>
                    <div class="input-wrapper">
                        <i class="ti ti-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/clientes}" class="btn-secondary">
                        <i class="ti ti-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-primary">
                        <i class="ti ti-floppy"></i> 
                        <span th:text="${accion == 'crear' ? 'Guardar' : 'Actualizar'}">Guardar</span>
                    </button>
                </div>
            </form>
        </div>

        <div style="text-align:center;padding:12px;font-size:12px;color:#8A8A8A;border-top:1px solid #E8E8E8;margin-top:12px;">
            <span th:text="${fechaActual}"></span>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.sidebar-menu li a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '#') {
                    link.classList.remove('active');
                    if (currentPath === href || (href !== '/admin/dashboard' && currentPath.startsWith(href))) {
                        link.classList.add('active');
                    }
                }
            });
        });
    </script>

</body>
</html>

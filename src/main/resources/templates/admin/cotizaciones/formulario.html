<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloFormulario} + ' · STAMOS Administración'">STAMOS · Cotización</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .header i {
            font-size: 28px;
            color: var(--yellow-dark);
        }
        
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 16px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            background: white;
            outline: none;
        }
        
        input:focus, select:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }
        
        /* Tabla de items */
        .items-section {
            margin-top: 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .items-header {
            background: var(--yellow-light);
            padding: 12px 16px;
            border-bottom: 1px solid var(--yellow-border);
            font-weight: 600;
            font-size: 13px;
            color: var(--yellow-dark);
        }
        
        .item-row {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .item-row:last-child {
            border-bottom: none;
        }
        
        .item-row input {
            padding: 8px 10px;
            margin: 0;
        }
        
        .item-row .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--red);
            transition: all 0.15s;
        }
        
        .item-row .btn-icon:hover {
            border-color: var(--red);
            background: var(--red-light);
        }
        
        .btn-add-item {
            margin: 16px;
            background: transparent;
            border: 1px dashed var(--yellow);
            color: var(--yellow-dark);
            padding: 10px;
            border-radius: 10px;
            width: calc(100% - 32px);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s;
        }
        
        .btn-add-item:hover {
            background: var(--yellow-light);
            border-color: var(--yellow);
        }
        
        /* Totales */
        .totals {
            margin-top: 20px;
            text-align: right;
            padding: 16px;
            background: var(--yellow-light);
            border-radius: 12px;
        }
        
        .totals p {
            margin: 6px 0;
            font-size: 14px;
        }
        
        .totals strong {
            font-size: 18px;
            color: var(--yellow-dark);
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        @media (max-width: 768px) {
            .item-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .item-row .btn-icon {
                justify-self: start;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="ti ti-file-invoice"></i>
        <h1 th:text="${tituloFormulario}">Formulario Cotización</h1>
    </div>

    <form th:action="@{/admin/cotizaciones/guardar}" method="post" id="cotizacionForm">
        <input type="hidden" th:field="*{codCot}">
        
        <div class="form-group">
            <label for="cliente">Cliente *</label>
            <div class="input-wrapper">
                <i class="ti ti-user"></i>
                <select id="cliente" name="clienteId" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="cli : ${clientes}" th:value="${cli.codCli}" th:text="${cli.razonCli}" 
                            th:selected="${cotizacion.cliente != null and cotizacion.cliente.codCli == cli.codCli}"></option>
                </select>
            </div>
        </div>

        <!-- Tabla de ítems dinámicos -->
        <div class="items-section">
            <div class="items-header">
                <div style="display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr; gap: 12px;">
                    <span>Descripción</span>
                    <span>Cantidad</span>
                    <span>Precio Unitario</span>
                    <span>Subtotal</span>
                    <span></span>
                </div>
            </div>
            <div id="itemsContainer">
                <!-- Los ítems existentes se cargarán con Thymeleaf (si es edición) -->
                <div th:each="det, iterStat : ${detalles}" class="item-row" data-index="${iterStat.index}">
                    <input type="text" class="item-desc" value="Añadir producto/servicio" th:value="${det.descripcion}" placeholder="Descripción">
                    <input type="number" class="item-qty" value="1" th:value="${det.cantidad}" step="1" min="1">
                    <input type="number" class="item-price" value="0.00" th:value="${det.precioUnitario}" step="0.01" min="0">
                    <span class="item-subtotal">0.00</span>
                    <button type="button" class="btn-icon" onclick="removeItem(this)"><i class="ti ti-trash"></i></button>
                </div>
            </div>
            <button type="button" class="btn-add-item" onclick="addItem()"><i class="ti ti-plus"></i> Agregar ítem</button>
        </div>

        <!-- Totales -->
        <div class="totals">
            <p>Subtotal: S/ <span id="subtotal">0.00</span></p>
            <p>IGV (18%): S/ <span id="igv">0.00</span></p>
            <p><strong>Total: S/ <span id="total">0.00</span></strong></p>
        </div>

        <input type="hidden" name="itemsJson" id="itemsJson">

        <div class="form-actions">
            <a th:href="@{/admin/cotizaciones}" class="btn-secondary">
                <i class="ti ti-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary">
                <i class="ti ti-device-floppy"></i> <span th:text="${textoBoton}">Guardar</span>
            </button>
        </div>
    </form>
</div>

<script>
    // Función para recalcular todos los subtotales y totales
    function recalculateTotals() {
        let subtotal = 0;
        const rows = document.querySelectorAll('#itemsContainer .item-row');
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            const subtotalRow = qty * price;
            row.querySelector('.item-subtotal').innerText = subtotalRow.toFixed(2);
            subtotal += subtotalRow;
        });
        const igv = subtotal * 0.18;
        const total = subtotal + igv;
        document.getElementById('subtotal').innerText = subtotal.toFixed(2);
        document.getElementById('igv').innerText = igv.toFixed(2);
        document.getElementById('total').innerText = total.toFixed(2);
    }

    // Agregar nueva fila de ítem
    function addItem() {
        const container = document.getElementById('itemsContainer');
        const newRow = document.createElement('div');
        newRow.className = 'item-row';
        newRow.innerHTML = `
            <input type="text" class="item-desc" placeholder="Descripción del producto/servicio">
            <input type="number" class="item-qty" value="1" step="1" min="1">
            <input type="number" class="item-price" value="0.00" step="0.01" min="0">
            <span class="item-subtotal">0.00</span>
            <button type="button" class="btn-icon" onclick="removeItem(this)"><i class="ti ti-trash"></i></button>
        `;
        container.appendChild(newRow);
        // Agregar event listeners a los nuevos inputs
        const inputs = newRow.querySelectorAll('input');
        inputs.forEach(input => input.addEventListener('input', recalculateTotals));
        recalculateTotals();
    }

    // Eliminar fila
    function removeItem(btn) {
        const row = btn.closest('.item-row');
        if (document.querySelectorAll('#itemsContainer .item-row').length > 1) {
            row.remove();
            recalculateTotals();
        } else {
            alert('Debe existir al menos un ítem en la cotización (RF-05).');
        }
    }

    // Antes de enviar el formulario, serializar los ítems a JSON
    function serializeItems() {
        const items = [];
        const rows = document.querySelectorAll('#itemsContainer .item-row');
        rows.forEach(row => {
            const desc = row.querySelector('.item-desc').value.trim();
            if (desc === "") return;
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            if (qty > 0 && price > 0) {
                items.push({
                    descripcion: desc,
                    cantidad: qty,
                    precioUnitario: price
                });
            }
        });
        document.getElementById('itemsJson').value = JSON.stringify(items);
    }

    // Configurar event listeners para inputs existentes
    function bindInputEvents() {
        const rows = document.querySelectorAll('#itemsContainer .item-row');
        rows.forEach(row => {
            const inputs = row.querySelectorAll('input');
            inputs.forEach(input => input.addEventListener('input', recalculateTotals));
        });
    }

    // Inicializar
    window.onload = () => {
        bindInputEvents();
        recalculateTotals();
        // Si no hay filas, agregar una por defecto (para cumplir RF-05)
        if (document.querySelectorAll('#itemsContainer .item-row').length === 0) {
            addItem();
        }
    };

    // Hook antes de enviar el formulario
    const form = document.getElementById('cotizacionForm');
    form.addEventListener('submit', (e) => {
        serializeItems();
        // Validar que haya al menos un ítem con descripción y cantidades>0
        const itemsJson = document.getElementById('itemsJson').value;
        const items = JSON.parse(itemsJson);
        if (items.length === 0) {
            e.preventDefault();
            alert('Debe agregar al menos un producto o servicio a la cotización.');
            return;
        }
        // Se envía normalmente
    });
</script>

</body>
</html>

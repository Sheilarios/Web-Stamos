<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' · STAMOS Administración'">STAMOS · Equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');

        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --blue: #1A56DB;
            --blue-light: #E8F0FE;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #F8F8F8;
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #000000;
            padding: 32px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            border-right: none;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #F5C400; border-radius: 4px; }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .sidebar-brand h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .sidebar-brand h2 span {
            color: #F5C400;
        }

        .sidebar-brand small {
            display: block;
            font-size: 11px;
            color: #8A8A8A;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 2px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: #C0C0C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
        }

        .sidebar-menu li a i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .sidebar-menu li a:hover {
            background: rgba(245, 196, 0, 0.10);
            color: #FFFFFF;
        }

        .sidebar-menu li a.active {
            background: #F5C400;
            color: #000000;
            font-weight: 600;
        }

        .sidebar-menu li a.active i {
            color: #000000;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #EF4444;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .sidebar-footer a:hover {
            background: rgba(239, 68, 68, 0.10);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px 40px;
            min-height: 100vh;
            background: #F8F8F8;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: #F5C400;
            font-size: 28px;
        }

        .page-title small {
            font-size: 14px;
            font-weight: 400;
            color: #8A8A8A;
            font-family: 'DM Sans', sans-serif;
            margin-left: 8px;
        }

        .user-info {
            background: #FFFFFF;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #E8E8E8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1A1F2E;
        }

        .user-info i {
            color: #F5C400;
        }

        .form-container {
            max-width: 800px;
            background: #FFFFFF;
            border: 1px solid #E8E8E8;
            border-radius: 16px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: #5A6478;
            margin-bottom: 6px;
        }

        label .required {
            color: #C0392B;
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9BA5B7;
            font-size: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #E2E6EA;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            background: white;
            outline: none;
            color: #1A1F2E;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #F5C400;
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }

        textarea {
            padding: 12px;
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #E2E6EA;
        }

        .btn-primary {
            background: #F5C400;
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .btn-primary:hover {
            background: #FFE566;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #E2E6EA;
            color: #5A6478;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }

        .btn-secondary:hover {
            border-color: #F5C400;
            color: #9A7500;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-danger {
            background: #FFF0EE;
            border: 1px solid #FECACA;
            color: #C0392B;
        }

        .alert-success {
            background: #EBF7F0;
            border: 1px solid #A7F3D0;
            color: #1A7040;
        }

        .info-box {
            background: #E8F0FE;
            border: 1px solid #B8D4FE;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #1A56DB;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
        }

        .info-box i {
            font-size: 18px;
            margin-top: 2px;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 72px;
                padding: 16px 0;
            }
            .sidebar-brand h2, .sidebar-brand small, .sidebar-menu li a span {
                display: none;
            }
            .sidebar-menu li a {
                justify-content: center;
                padding: 12px;
            }
            .sidebar-menu li a i {
                font-size: 22px;
                width: auto;
            }
            .sidebar-footer a span {
                display: none;
            }
            .sidebar-footer a {
                justify-content: center;
            }
            .main-content {
                margin-left: 72px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid #222;
                flex-wrap: wrap;
            }
            .sidebar-brand {
                padding: 0;
                border-bottom: none;
                margin-bottom: 0;
                flex: 1;
            }
            .sidebar-brand h2 {
                font-size: 20px;
            }
            .sidebar-brand small {
                display: block;
                font-size: 10px;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0;
                flex: 1;
            }
            .sidebar-menu li {
                margin-bottom: 0;
            }
            .sidebar-menu li a {
                padding: 6px 10px;
                font-size: 12px;
            }
            .sidebar-menu li a i {
                font-size: 16px;
            }
            .sidebar-menu li a span {
                display: inline;
                font-size: 11px;
            }
            .sidebar-footer {
                border-top: none;
                padding: 0;
                margin: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .page-title {
                font-size: 22px;
            }
            .form-container {
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .form-actions {
                flex-wrap: wrap;
            }
            .form-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>STAMOS<span>.</span></h2>
            <small>Administración</small>
        </div>

        <ul class="sidebar-menu">
            <li th:each="item : ${menuItems}">
                <a th:href="${item.url}" 
                   th:classappend="${#strings.equalsIgnoreCase(currentPath, item.url)} ? 'active' : ''">
                    <i th:class="${item.icon}"></i>
                    <span th:text="${item.label}"></span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main class="main-content">

        <div class="header">
            <div class="page-title">
                <i th:if="${accion == 'crear'}" class="bi bi-laptop"></i>
                <i th:unless="${accion == 'crear'}" class="bi bi-pencil"></i>
                <span th:text="${titulo}">Formulario Equipo</span>
                <small th:if="${inventario != null and inventario.idInventario != null}" 
                       th:text="'ID: ' + ${inventario.idInventario}">ID: 0</small>
            </div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${username}">Administrador</span>
                <span style="color:#8A8A8A;font-size:11px;" th:text="${rol}">Admin</span>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <div class="form-container">

            <div class="info-box" th:if="${accion == 'editar'}">
                <i class="bi bi-info-circle"></i>
                <div>
                    <strong>Código Serial:</strong> <span th:text="${inventario.codigoSerial}">—</span>
                    <span style="display:block; font-size:12px; color:#8A8A8A; margin-top:4px;">
                        <i class="bi bi-lock"></i> El código serial no se puede modificar después de la creación.
                    </span>
                </div>
            </div>

            <form th:action="@{${accion == 'crear' ? '/admin/inventario/crear' : '/admin/inventario/actualizar/' + inventario.idInventario}}" 
                  th:object="${inventario}" method="post">

                <input type="hidden" th:field="*{idInventario}">

                <div class="form-group">
                    <label for="idProducto">Producto <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="bi bi-box"></i>
                        <select id="idProducto" th:field="*{idProducto}" required>
                            <option value="">Seleccione un producto</option>
                            <option th:each="p : ${productos}" th:value="${p.idProducto}" 
                                    th:text="${p.nombreItem + ' (' + p.tipo + ') - ' + p.precioBaseFormateado}" 
                                    th:selected="${inventario.idProducto == p.idProducto}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="codigoSerial">Código Serial <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="bi bi-upc-scan"></i>
                        <input type="text" id="codigoSerial" th:field="*{codigoSerial}" 
                               th:readonly="${accion == 'editar'}" required 
                               placeholder="Ingrese el código serial único">
                    </div>
                    <div style="font-size:11px; color:#8A8A8A; margin-top:4px;">
                        <i class="bi bi-info-circle"></i> 
                        <span th:if="${accion == 'crear'}">El código serial debe ser único en el sistema.</span>
                        <span th:unless="${accion == 'crear'}">El código serial no se puede modificar.</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ubicacion">Ubicación</label>
                        <div class="input-wrapper">
                            <i class="bi bi-geo-alt"></i>
                            <input type="text" id="ubicacion" th:field="*{ubicacion}" 
                                   placeholder="Almacén, estante, sección...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="estadoFisico">Estado Físico <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-arrow-left-right"></i>
                            <select id="estadoFisico" th:field="*{estadoFisico}" required>
                                <option value="Disponible">Disponible</option>
                                <option value="En uso">En uso</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                                <option value="Dañado">Dañado</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fechaAdquisicion">Fecha de Adquisición</label>
                        <div class="input-wrapper">
                            <i class="bi bi-calendar"></i>
                            <input type="date" id="fechaAdquisicion" th:field="*{fechaAdquisicion}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="valorCompra">Valor de Compra (S/)</label>
                        <div class="input-wrapper">
                            <i class="bi bi-coin"></i>
                            <input type="number" id="valorCompra" th:field="*{valorCompra}" 
                                   step="0.01" min="0" placeholder="0.00">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones</label>
                    <div class="input-wrapper">
                        <i class="bi bi-sticky"></i>
                        <textarea id="observaciones" th:field="*{observaciones}" rows="2" 
                                  placeholder="Observaciones adicionales sobre el equipo..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/inventario}" class="btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-floppy"></i> 
                        <span th:text="${accion == 'crear' ? 'Registrar Equipo' : 'Actualizar Equipo'}">Guardar</span>
                    </button>
                </div>
            </form>
        </div>

        <div style="text-align:center;padding:12px;font-size:12px;color:#8A8A8A;border-top:1px solid #E8E8E8;margin-top:12px;">
            <span th:text="${fechaActual}"></span>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.sidebar-menu li a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '#') {
                    link.classList.remove('active');
                    if (currentPath === href || (href !== '/admin/dashboard' && currentPath.startsWith(href))) {
                        link.classList.add('active');
                    }
                }
            });
        });
    </script>

</body>
</html>

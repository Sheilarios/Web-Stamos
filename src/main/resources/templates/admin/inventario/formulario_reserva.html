<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Equipo a Proyecto · STAMOS Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --blue: #1A56DB;
            --blue-light: #E8F0FE;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .header i {
            font-size: 28px;
            color: var(--yellow-dark);
        }
        
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        
        .header small {
            font-size: 13px;
            color: var(--text-3);
            font-weight: 400;
            margin-left: 8px;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-danger {
            background: var(--red-light);
            border: 1px solid #FECACA;
            color: var(--red);
        }
        
        .alert-success {
            background: var(--green-light);
            border: 1px solid #A7F3D0;
            color: var(--green);
        }
        
        .alert-warning {
            background: var(--yellow-light);
            border: 1px solid var(--yellow-border);
            color: var(--yellow-dark);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        
        label .required {
            color: var(--red);
            margin-left: 2px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 16px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            background: white;
            outline: none;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }
        
        textarea {
            padding: 12px;
            resize: vertical;
            min-height: 60px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .info-box {
            background: var(--blue-light);
            border: 1px solid #B8D4FE;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--blue);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .info-box i {
            font-size: 18px;
            margin-top: 2px;
        }
        
        .equipo-info {
            background: var(--yellow-light);
            border: 1px solid var(--yellow-border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .equipo-info .label {
            font-size: 11px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .equipo-info .value {
            font-weight: 600;
            color: var(--text);
        }
        
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-disponible {
            background: var(--green-light);
            color: var(--green);
        }
        
        @media (max-width: 640px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .form-actions { flex-wrap: wrap; }
            .form-actions .btn { flex: 1; justify-content: center; }
            .equipo-info { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="ti ti-calendar-plus"></i>
        <h1>Asignar Equipo a Proyecto</h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${warning}" class="alert alert-warning" th:text="${warning}"></div>

    <div class="info-box">
        <i class="ti ti-info-circle"></i>
        <div>
            <strong>Reserva de equipos</strong><br>
            Asigna un equipo disponible a un proyecto. 
            Verifica que el equipo esté disponible en las fechas seleccionadas.
        </div>
    </div>

    <div class="equipo-info" th:if="${equipoSeleccionado != null}">
        <div>
            <div class="label">Equipo seleccionado</div>
            <div class="value" th:text="${equipoSeleccionado.nombreProducto} + ' (' + ${equipoSeleccionado.codigoSerial} + ')'">—</div>
        </div>
        <div>
            <div class="label">Estado</div>
            <div class="value">
                <span class="status-badge status-disponible" th:text="${equipoSeleccionado.estadoFisico}">Disponible</span>
            </div>
        </div>
        <div>
            <div class="label">Ubicación</div>
            <div class="value" th:text="${equipoSeleccionado.ubicacion != null ? equipoSeleccionado.ubicacion : 'No especificada'}">—</div>
        </div>
    </div>

    <div class="equipo-info" th:if="${proyectoSeleccionado != null}">
        <div>
            <div class="label">Proyecto seleccionado</div>
            <div class="value" th:text="${proyectoSeleccionado.nombreProyecto}">—</div>
        </div>
        <div>
            <div class="label">Cliente</div>
            <div class="value" th:text="${proyectoSeleccionado.nombreCliente}">—</div>
        </div>
        <div>
            <div class="label">Estado</div>
            <div class="value" th:text="${proyectoSeleccionado.estado}">—</div>
        </div>
    </div>

    <form th:action="@{/admin/inventario/reservar}" th:object="${reserva}" method="post">
        
        <input type="hidden" th:field="*{idReserva}">

        <div class="form-group">
            <label for="idInventario">Equipo <span class="required">*</span></label>
            <div class="input-wrapper">
                <i class="ti ti-box"></i>
                <select id="idInventario" th:field="*{idInventario}" required>
                    <option value="">Seleccione un equipo</option>
                    <option th:each="e : ${equipos}" th:value="${e.idInventario}" 
                            th:text="${e.nombreProducto} + ' (' + ${e.codigoSerial} + ') - ' + ${e.ubicacion}" 
                            th:selected="${reserva.idInventario == e.idInventario}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="idProyecto">Proyecto <span class="required">*</span></label>
            <div class="input-wrapper">
                <i class="ti ti-folder"></i>
                <select id="idProyecto" th:field="*{idProyecto}" required>
                    <option value="">Seleccione un proyecto</option>
                    <option th:each="p : ${proyectos}" th:value="${p.idProyecto}" 
                            th:text="${p.nombreProyecto} + ' - ' + ${p.nombreCliente}" 
                            th:selected="${reserva.idProyecto == p.idProyecto}"></option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="fechaInicio">Fecha de Inicio <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="ti ti-calendar"></i>
                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="fechaFin">Fecha de Fin <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="ti ti-calendar"></i>
                    <input type="date" id="fechaFin" th:field="*{fechaFin}" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="notas">Notas</label>
            <div class="input-wrapper">
                <i class="ti ti-notes"></i>
                <textarea id="notas" th:field="*{notas}" rows="2" 
                          placeholder="Observaciones sobre la reserva..."></textarea>
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/admin/inventario}" class="btn-secondary">
                <i class="ti ti-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary">
                <i class="ti ti-calendar-check"></i> Asignar Equipo
            </button>
        </div>
    </form>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fechaInicio = document.getElementById('fechaInicio');
        const fechaFin = document.getElementById('fechaFin');
        const equipoSelect = document.getElementById('idInventario');

        fechaInicio.addEventListener('change', function() {
            if (fechaFin.value && fechaInicio.value > fechaFin.value) {
                alert('La fecha de inicio no puede ser posterior a la fecha de fin.');
                fechaFin.value = '';
            }
            verificarDisponibilidad();
        });

        fechaFin.addEventListener('change', function() {
            if (fechaInicio.value && fechaFin.value < fechaInicio.value) {
                alert('La fecha de fin no puede ser anterior a la fecha de inicio.');
                fechaFin.value = '';
            }
            verificarDisponibilidad();
        });

        equipoSelect.addEventListener('change', verificarDisponibilidad);

        function verificarDisponibilidad() {
            const equipoId = equipoSelect.value;
            const inicio = fechaInicio.value;
            const fin = fechaFin.value;

            if (equipoId && inicio && fin) {
                fetch(`/admin/inventario/verificar-disponibilidad/${equipoId}?fechaInicio=${inicio}&fechaFin=${fin}`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.disponible) {
                            alert('El equipo no está disponible en el rango de fechas seleccionado.');
                            equipoSelect.value = '';
                        }
                    })
                    .catch(() => {});
            }
        }
    });
</script>

</body>
</html>

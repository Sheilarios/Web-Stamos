<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAMOS · Administración · Registrar Pago</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .header i {
            font-size: 28px;
            color: var(--yellow-dark);
        }
        
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 16px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            background: white;
            outline: none;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(245, 196, 0, 0.15);
        }
        
        input[type="file"] {
            padding: 8px;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        @media (max-width: 640px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="ti ti-credit-card"></i>
        <h1>Registrar Pago Manual</h1>
    </div>

    <form th:action="@{/admin/pagos/guardar}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="proyectoId">Proyecto *</label>
            <div class="input-wrapper">
                <i class="ti ti-folder"></i>
                <select id="proyectoId" name="proyectoId" required>
                    <option value="">Seleccione un proyecto</option>
                    <option th:each="proy : ${proyectos}" th:value="${proy.codProy}" th:text="${proy.nombre}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="monto">Monto (S/) *</label>
            <div class="input-wrapper">
                <i class="ti ti-coin"></i>
                <input type="number" id="monto" name="monto" step="0.01" min="0.01" required placeholder="0.00">
            </div>
        </div>

        <div class="form-group">
            <label for="medioPago">Medio de pago *</label>
            <div class="input-wrapper">
                <i class="ti ti-wallet"></i>
                <select id="medioPago" name="medioPago" required>
                    <option value="">Seleccionar</option>
                    <option value="TRANSFERENCIA">Transferencia bancaria</option>
                    <option value="YAPE">Yape</option>
                    <option value="DEPOSITO">Depósito en efectivo</option>
                    <option value="EFECTIVO">Efectivo</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="numeroOperacion">Número de operación / Voucher</label>
            <div class="input-wrapper">
                <i class="ti ti-receipt"></i>
                <input type="text" id="numeroOperacion" name="numeroOperacion" placeholder="Ej: 1234567890">
            </div>
        </div>

        <div class="form-group">
            <label for="comprobante">Comprobante (archivo)</label>
            <div class="input-wrapper">
                <i class="ti ti-file"></i>
                <input type="file" id="comprobante" name="comprobante" accept="image/*,application/pdf">
            </div>
            <div style="font-size: 11px; color: var(--text-3); margin-top: 4px;">Formatos permitidos: JPG, PNG, PDF (máx. 10MB)</div>
        </div>

        <input type="hidden" name="origen" value="admin">

        <div class="form-actions">
            <a th:href="@{/admin/pagos}" class="btn-secondary">
                <i class="ti ti-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary">
                <i class="ti ti-device-floppy"></i> Guardar Pago
            </button>
        </div>
    </form>
</div>

</body>
</html>

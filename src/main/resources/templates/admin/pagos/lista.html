<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAMOS · Administración · Pagos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .page-title i {
            color: var(--yellow-dark);
            font-size: 28px;
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .filters-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
        }
        
        .filter-group i {
            color: var(--text-3);
            font-size: 16px;
        }
        
        .filter-group select, .filter-group input {
            border: none;
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            text-decoration: none;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            text-align: left;
            padding: 14px 16px;
            background: var(--yellow-light);
            color: var(--yellow-dark);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--yellow-border);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-2);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-verificado {
            background: var(--green-light);
            color: var(--green);
        }
        
        .status-verificacion {
            background: var(--yellow-light);
            color: var(--yellow-dark);
        }
        
        .status-rechazado {
            background: var(--red-light);
            color: var(--red);
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            color: var(--text-2);
        }
        
        .btn-icon:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .btn-icon.approve:hover {
            border-color: var(--green);
            color: var(--green);
        }
        
        .btn-icon.reject:hover {
            border-color: var(--red);
            color: var(--red);
        }
        
        .empty-message {
            text-align: center;
            padding: 48px;
            color: var(--text-3);
        }
        
        .empty-message i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            th, td { padding: 10px 12px; }
            .action-buttons { flex-direction: column; align-items: flex-start; }
            .btn-icon { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="page-title">
            <i class="ti ti-credit-card"></i>
            <span>Gestión de Pagos</span>
        </div>
        <a th:href="@{/admin/pagos/nuevo}" class="btn-primary">
            <i class="ti ti-plus"></i> Registrar Pago
        </a>
    </div>

    <form th:action="@{/admin/pagos}" method="get" class="filters-bar">
        <div class="filter-group">
            <i class="ti ti-folder"></i>
            <select name="proyectoId">
                <option value="">Todos los proyectos</option>
                <option th:each="proy : ${proyectos}" th:value="${proy.codProy}" th:text="${proy.nombre}" 
                        th:selected="${proyectoIdSeleccionado != null and proyectoIdSeleccionado == proy.codProy}"></option>
            </select>
        </div>
        <div class="filter-group">
            <i class="ti ti-filter"></i>
            <select name="estado">
                <option value="">Todos los estados</option>
                <option value="VERIFICACION" th:selected="${estadoSeleccionado == 'VERIFICACION'}">En verificación</option>
                <option value="VERIFICADO" th:selected="${estadoSeleccionado == 'VERIFICADO'}">Verificado</option>
                <option value="RECHAZADO" th:selected="${estadoSeleccionado == 'RECHAZADO'}">Rechazado</option>
            </select>
        </div>
        <button type="submit" class="btn-secondary">Filtrar</button>
        <a th:href="@{/admin/pagos}" class="btn-secondary" th:if="${proyectoIdSeleccionado != null or estadoSeleccionado != null}">Limpiar</a>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Proyecto</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                    <th>Medio de pago</th>
                    <th>Comprobante</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pagos}">
                    <td th:text="${p.id}">—</td>
                    <td th:text="${p.proyecto.nombre}">—</td>
                    <td th:text="'S/ ' + ${p.monto}">—</td>
                    <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}">—</td>
                    <td th:text="${p.medioPago}">—</td>
                    <td>
                        <a th:if="${p.comprobanteUrl != null}" th:href="@{'/uploads/' + ${p.comprobanteUrl}}" target="_blank" class="btn-icon" style="border: none;">
                            <i class="ti ti-eye"></i> Ver
                        </a>
                        <span th:unless="${p.comprobanteUrl != null}">—</span>
                    </td>
                    <td>
                        <span th:classappend="${p.estado == 'VERIFICADO'} ? 'status-badge status-verificado' : 
                                              (p.estado == 'VERIFICACION' ? 'status-badge status-verificacion' : 'status-badge status-rechazado')"
                              th:text="${p.estado}">—</span>
                    </td>
                    <td class="action-buttons">
                        <a th:href="@{/admin/pagos/detalle/{id}(id=${p.id})}" class="btn-icon"><i class="ti ti-eye"></i> Detalle</a>
                        <form th:action="@{/admin/pagos/validar/{id}(id=${p.id})}" method="post" style="display: inline;" th:if="${p.estado == 'VERIFICACION'}">
                            <button type="submit" class="btn-icon approve" onclick="return confirm('¿Validar este pago?');"><i class="ti ti-check"></i> Validar</button>
                        </form>
                        <form th:action="@{/admin/pagos/rechazar/{id}(id=${p.id})}" method="post" style="display: inline;" th:if="${p.estado == 'VERIFICACION'}">
                            <button type="submit" class="btn-icon reject" onclick="return confirm('¿Rechazar este pago?');"><i class="ti ti-x"></i> Rechazar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pagos.isEmpty()}">
                    <td colspan="8">
                        <div class="empty-message">
                            <i class="ti ti-receipt-off"></i>
                            <p>No hay pagos registrados.</p>
                            <a th:href="@{/admin/pagos/nuevo}" class="btn-primary" style="margin-top: 16px;">Registrar primer pago</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pagos · STAMOS Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --blue: #1A56DB;
            --blue-light: #E8F0FE;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .page-title i {
            color: var(--yellow-dark);
            font-size: 28px;
        }
        
        .page-title .count {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-3);
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .filters-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
        }
        
        .filter-group i {
            color: var(--text-3);
            font-size: 16px;
        }
        
        .filter-group select, .filter-group input {
            border: none;
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
        }
        
        .filter-group input[type="date"] {
            min-width: 130px;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            text-align: left;
            padding: 14px 16px;
            background: var(--yellow-light);
            color: var(--yellow-dark);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--yellow-border);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-2);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover td {
            background: var(--yellow-light);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-validado {
            background: var(--green-light);
            color: var(--green);
        }
        
        .status-pendiente {
            background: var(--yellow-light);
            color: var(--yellow-dark);
        }
        
        .status-rechazado {
            background: var(--red-light);
            color: var(--red);
        }
        
        .metodo-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metodo-efectivo { background: #D1FAE5; color: #047857; }
        .metodo-transferencia { background: #E8F0FE; color: #1A56DB; }
        .metodo-tarjeta { background: #FEF3C7; color: #B45309; }
        .metodo-cheque { background: #FCE4EC; color: #C62828; }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-icon:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .btn-icon.verde:hover {
            border-color: var(--green);
            color: var(--green);
        }
        
        .btn-icon.rojo:hover {
            border-color: var(--red);
            color: var(--red);
        }
        
        .btn-icon.azul:hover {
            border-color: var(--blue);
            color: var(--blue);
        }
        
        .empty-message {
            text-align: center;
            padding: 48px;
            color: var(--text-3);
        }
        
        .empty-message i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-message p {
            font-size: 14px;
        }
        
        .pagination {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .pagination-info {
            font-size: 13px;
            color: var(--text-3);
        }
        
        .pagination-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .page-link {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-2);
            font-size: 13px;
            transition: all 0.15s;
        }
        
        .page-link:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .page-link.active {
            background: var(--yellow);
            border-color: var(--yellow);
            color: #2A1800;
            font-weight: 600;
        }
        
        .page-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: center;
        }
        
        .stat-card .numero {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        
        .stat-card .etiqueta {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-3);
            font-weight: 600;
            margin-top: 2px;
        }
        
        .stat-card .numero.amarillo { color: var(--yellow-dark); }
        .stat-card .numero.verde { color: var(--green); }
        .stat-card .numero.rojo { color: var(--red); }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        
        .alert-success {
            background: var(--green-light);
            border: 1px solid #A7F3D0;
            color: var(--green);
        }
        
        .alert-danger {
            background: var(--red-light);
            border: 1px solid #FECACA;
            color: var(--red);
        }
        
        @media (max-width: 768px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            .filters-bar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; }
            .filter-group select, .filter-group input { width: 100%; }
            th, td { padding: 10px 12px; font-size: 12px; }
            .action-buttons { flex-direction: column; align-items: stretch; }
            .btn-icon { justify-content: center; }
            .pagination { flex-direction: column; align-items: center; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }
        
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="page-title">
            <i class="ti ti-credit-card"></i>
            <span>Gestión de Pagos</span>
            <span class="count" th:text="'(' + ${totalItems != null ? totalItems : 0} + ')'">(0)</span>
        </div>
        <a th:href="@{/admin/pagos/registrar}" class="btn-primary">
            <i class="ti ti-plus"></i> Registrar Pago
        </a>
    </div>

    <!-- ✅ Fragmentos con sintaxis moderna -->
    <div th:replace="~{fragments/mensajes :: mensaje_exito}"></div>
    <div th:replace="~{fragments/mensajes :: mensaje_error}"></div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="numero amarillo" th:text="${totalPendientes != null ? totalPendientes : 0}">0</div>
            <div class="etiqueta">Pendientes de validación</div>
        </div>
        <div class="stat-card">
            <div class="numero verde" th:text="${totalValidados != null ? totalValidados : 0}">0</div>
            <div class="etiqueta">Validados</div>
        </div>
        <div class="stat-card">
            <div class="numero rojo" th:text="${totalRechazados != null ? totalRechazados : 0}">0</div>
            <div class="etiqueta">Rechazados</div>
        </div>
    </div>

    <form th:action="@{/admin/pagos}" method="get" class="filters-bar">
        <div class="filter-group">
            <i class="ti ti-filter"></i>
            <select name="estado">
                <option value="">Todos los estados</option>
                <option value="Pendiente" th:selected="${estado == 'Pendiente'}">Pendientes</option>
                <option value="Validado" th:selected="${estado == 'Validado'}">Validados</option>
                <option value="Rechazado" th:selected="${estado == 'Rechazado'}">Rechazados</option>
            </select>
        </div>
        <div class="filter-group">
            <i class="ti ti-folder"></i>
            <select name="proyectoId">
                <option value="">Todos los proyectos</option>
                <option th:each="p : ${proyectos}" th:value="${p.idProyecto}" 
                        th:text="${p.nombreProyecto}" 
                        th:selected="${proyectoId != null and proyectoId == p.idProyecto}"></option>
            </select>
        </div>
        <div class="filter-group">
            <i class="ti ti-calendar"></i>
            <input type="date" name="fechaInicio" th:value="${fechaInicio}">
        </div>
        <div class="filter-group">
            <i class="ti ti-calendar"></i>
            <input type="date" name="fechaFin" th:value="${fechaFin}">
        </div>
        <button type="submit" class="btn-secondary">
            <i class="ti ti-search"></i> Filtrar
        </button>
        <a th:href="@{/admin/pagos}" class="btn-secondary" th:if="${estado != null or proyectoId != null or fechaInicio != null or fechaFin != null}">
            <i class="ti ti-refresh"></i> Limpiar
        </a>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Proyecto</th>
                    <th>Cliente</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                    <th>Método</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pago : ${pagos}">
                    <td th:text="${pago.idPago}">—</td>
                    <td>
                        <span th:text="${pago.nombreProyecto != null ? pago.nombreProyecto : '—'}">—</span>
                        <span style="display:block; font-size:11px; color:var(--text-3);" 
                              th:text="${pago.codigoProyecto != null ? pago.codigoProyecto : '—'}">—</span>
                    </td>
                    <td th:text="${pago.nombreCliente != null ? pago.nombreCliente : '—'}">—</td>
                    <td>
                        <strong th:text="${pago.monto != null ? 'S/ ' + #numbers.formatDecimal(pago.monto, 0, 'COMMA', 2, 'POINT') : 'S/ 0.00'}">S/ 0.00</strong>
                        <span style="display:block; font-size:11px; color:var(--text-3);" 
                              th:text="'Total proyecto: ' + (${pago.montoTotalProyecto != null ? 'S/ ' + #numbers.formatDecimal(pago.montoTotalProyecto, 0, 'COMMA', 2, 'POINT') : 'S/ 0.00'})">Total proyecto: S/ 0.00</span>
                    </td>
                    <td th:text="${pago.fechaPago != null ? #temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                    <td>
                        <span class="metodo-badge" 
                              th:classappend="${pago.metodoPago == 'Efectivo'} ? 'metodo-efectivo' : 
                                              (pago.metodoPago == 'Transferencia' ? 'metodo-transferencia' : 
                                              (pago.metodoPago == 'Tarjeta' ? 'metodo-tarjeta' : 'metodo-cheque'))"
                              th:text="${pago.metodoPago != null ? pago.metodoPago : '—'}">—</span>
                    </td>
                    <td>
                        <span class="status-badge" 
                              th:classappend="${pago.estadoPago == 'Validado'} ? 'status-validado' : 
                                              (pago.estadoPago == 'Pendiente' ? 'status-pendiente' : 'status-rechazado')"
                              th:text="${pago.estadoPago != null ? pago.estadoPago : '—'}">—</span>
                    </td>
                    <td class="action-buttons">
                        <a th:href="@{/admin/pagos/detalle/{id}(id=${pago.idPago})}" class="btn-icon azul">
                            <i class="ti ti-eye"></i> Detalle
                        </a>
                        <form th:action="@{/admin/pagos/validar/{id}(id=${pago.idPago})}" method="post" style="display:inline;" 
                              th:if="${pago.estadoPago == 'Pendiente'}">
                            <button type="submit" class="btn-icon verde" onclick="return confirm('¿Validar este pago?');">
                                <i class="ti ti-check"></i> Validar
                            </button>
                        </form>
                        <form th:action="@{/admin/pagos/rechazar/{id}(id=${pago.idPago})}" method="post" style="display:inline;" 
                              th:if="${pago.estadoPago == 'Pendiente'}">
                            <button type="submit" class="btn-icon rojo" onclick="return confirm('¿Rechazar este pago?');">
                                <i class="ti ti-x"></i> Rechazar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pagos == null or #lists.isEmpty(pagos)}">
                    <td colspan="8">
                        <div class="empty-message">
                            <i class="ti ti-credit-card-off"></i>
                            <p>No hay pagos registrados.</p>
                            <a th:href="@{/admin/pagos/registrar}" class="btn-primary" style="margin-top: 16px;">
                                <i class="ti ti-plus"></i> Registrar primer pago
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${pagos != null and !#lists.isEmpty(pagos)}">
        <div class="pagination-info">
            Mostrando <span th:text="${#lists.size(pagos)}">0</span> de <span th:text="${totalItems != null ? totalItems : 0}">0</span> pagos
        </div>
        <div class="pagination-buttons">
            <a th:href="@{/admin/pagos(page=${currentPage != null ? currentPage - 1 : 0}, estado=${estado}, proyectoId=${proyectoId}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}" 
               class="page-link" 
               th:classappend="${currentPage == null or currentPage == 0} ? 'disabled' : ''">
                Anterior
            </a>
            <a th:each="i : ${#numbers.sequence(0, totalPages != null ? totalPages - 1 : 0)}" 
               th:href="@{/admin/pagos(page=${i}, estado=${estado}, proyectoId=${proyectoId}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}" 
               class="page-link" 
               th:classappend="${i == currentPage} ? 'active' : ''"
               th:text="${i + 1}">
                1
            </a>
            <a th:href="@{/admin/pagos(page=${currentPage != null ? currentPage + 1 : 1}, estado=${estado}, proyectoId=${proyectoId}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}" 
               class="page-link" 
               th:classappend="${currentPage == null or currentPage == totalPages - 1} ? 'disabled' : ''">
                Siguiente
            </a>
        </div>
    </div>

</div>

</body>
</html>

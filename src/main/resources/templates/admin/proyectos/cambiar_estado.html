<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAMOS · Administración · Cambiar estado proyecto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .header i {
            font-size: 28px;
            color: var(--yellow-dark);
        }
        
        .header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 16px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        
        input:focus, select:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(245,196,0,0.15);
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .info-card {
            background: var(--yellow-light);
            border: 1px solid var(--yellow-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        
        @media (max-width: 640px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="ti ti-arrow-forward"></i>
        <h1>Cambiar estado del proyecto</h1>
    </div>

    <div class="info-card">
        <div><strong>Proyecto:</strong> <span th:text="${proyecto.nombre}">—</span></div>
        <div><strong>Estado actual:</strong> <span th:text="${proyecto.estado}">—</span></div>
    </div>

    <form th:action="@{/admin/proyectos/avanzar/{id}(id=${proyecto.codProy})}" method="post">
        <div class="form-group">
            <label for="siguienteEstado">Siguiente estado</label>
            <div class="input-wrapper">
                <i class="ti ti-flag"></i>
                <select id="siguienteEstado" name="nuevoEstado" required>
                    <option value="">Seleccione el siguiente estado</option>
                    <option th:each="est : ${estadosPermitidos}" th:value="${est}" th:text="${est}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="responsable">Responsable del cambio</label>
            <div class="input-wrapper">
                <i class="ti ti-user"></i>
                <input type="text" id="responsable" name="responsable" th:value="${#authentication.name}" required>
            </div>
        </div>
        <div class="form-actions">
            <a th:href="@{/admin/proyectos/detalle/{id}(id=${proyecto.codProy})}" class="btn-secondary"><i class="ti ti-arrow-left"></i> Cancelar</a>
            <button type="submit" class="btn-primary"><i class="ti ti-check"></i> Confirmar cambio</button>
        </div>
    </form>
</div>

</body>
</html>

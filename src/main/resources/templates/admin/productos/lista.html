<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos · STAMOS Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --yellow-border: #E0C84A;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
            --red: #C0392B;
            --red-light: #FFF0EE;
            --green: #1A7040;
            --green-light: #EBF7F0;
            --blue: #1A56DB;
            --blue-light: #E8F0FE;
            --purple: #7C3AED;
            --purple-light: #EDE9FE;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 24px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 32px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .page-title i {
            color: var(--yellow-dark);
            font-size: 28px;
        }
        
        .page-title .count {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-3);
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: #2A1800;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        
        .btn-primary:hover {
            background: var(--yellow-mid);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .filters-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
        }
        
        .filter-group i {
            color: var(--text-3);
            font-size: 16px;
        }
        
        .filter-group select, .filter-group input {
            border: none;
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            text-align: left;
            padding: 14px 16px;
            background: var(--yellow-light);
            color: var(--yellow-dark);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--yellow-border);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-2);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover td {
            background: var(--yellow-light);
        }
        
        .badge-tipo {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-alquiler { background: #DBEAFE; color: #2563EB; }
        .badge-venta { background: var(--green-light); color: var(--green); }
        .badge-servicio { background: var(--purple-light); color: var(--purple); }
        
        .badge-estado {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .badge-activo { background: var(--green-light); color: var(--green); }
        .badge-inactivo { background: var(--red-light); color: var(--red); }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-icon:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .btn-icon.azul:hover {
            border-color: var(--blue);
            color: var(--blue);
        }
        
        .btn-icon.verde:hover {
            border-color: var(--green);
            color: var(--green);
        }
        
        .btn-icon.rojo:hover {
            border-color: var(--red);
            color: var(--red);
        }
        
        .empty-message {
            text-align: center;
            padding: 48px;
            color: var(--text-3);
        }
        
        .empty-message i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-message p {
            font-size: 14px;
        }
        
        .pagination {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .pagination-info {
            font-size: 13px;
            color: var(--text-3);
        }
        
        .pagination-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .page-link {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-2);
            font-size: 13px;
            transition: all 0.15s;
        }
        
        .page-link:hover {
            border-color: var(--yellow);
            color: var(--yellow-dark);
        }
        
        .page-link.active {
            background: var(--yellow);
            border-color: var(--yellow);
            color: #2A1800;
            font-weight: 600;
        }
        
        .page-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: center;
        }
        
        .stat-card .numero {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        
        .stat-card .etiqueta {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-3);
            font-weight: 600;
            margin-top: 2px;
        }
        
        .stat-card .numero.azul { color: var(--blue); }
        .stat-card .numero.verde { color: var(--green); }
        .stat-card .numero.purple { color: var(--purple); }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        
        .alert-success {
            background: var(--green-light);
            border: 1px solid #A7F3D0;
            color: var(--green);
        }
        
        .alert-danger {
            background: var(--red-light);
            border: 1px solid #FECACA;
            color: var(--red);
        }
        
        @media (max-width: 768px) {
            body { padding: 20px; }
            .container { padding: 20px; }
            .filters-bar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; }
            .filter-group select, .filter-group input { width: 100%; }
            th, td { padding: 10px 12px; font-size: 12px; }
            .action-buttons { flex-direction: column; align-items: stretch; }
            .btn-icon { justify-content: center; }
            .pagination { flex-direction: column; align-items: center; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }
        
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="page-title">
            <i class="ti ti-package"></i>
            <span>Catálogo de Productos</span>
            <span class="count" th:text="'(' + ${totalItems != null ? totalItems : 0} + ')'">(0)</span>
        </div>
        <a th:href="@{/admin/productos/nuevo}" class="btn-primary">
            <i class="ti ti-plus"></i> Nuevo Producto
        </a>
    </div>

    <div th:replace="fragments/mensajes :: mensaje_exito"></div>
    <div th:replace="fragments/mensajes :: mensaje_error"></div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="numero azul" th:text="${totalAlquiler != null ? totalAlquiler : 0}">0</div>
            <div class="etiqueta">Alquiler</div>
        </div>
        <div class="stat-card">
            <div class="numero verde" th:text="${totalVenta != null ? totalVenta : 0}">0</div>
            <div class="etiqueta">Venta</div>
        </div>
        <div class="stat-card">
            <div class="numero purple" th:text="${totalServicio != null ? totalServicio : 0}">0</div>
            <div class="etiqueta">Servicio</div>
        </div>
        <div class="stat-card">
            <div class="numero" th:text="${totalActivos != null ? totalActivos : 0}">0</div>
            <div class="etiqueta">Activos</div>
        </div>
    </div>

    <form th:action="@{/admin/productos}" method="get" class="filters-bar">
        <div class="filter-group">
            <i class="ti ti-search"></i>
            <input type="text" name="search" th:value="${search}" placeholder="Buscar por nombre...">
        </div>
        <div class="filter-group">
            <i class="ti ti-category"></i>
            <select name="categoriaId">
                <option value="">Todas las categorías</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" 
                        th:text="${c.nombreCategoria}" 
                        th:selected="${categoriaId != null and categoriaId == c.idCategoria}"></option>
            </select>
        </div>
        <div class="filter-group">
            <i class="ti ti-filter"></i>
            <select name="tipo">
                <option value="">Todos los tipos</option>
                <option value="Alquiler" th:selected="${tipo == 'Alquiler'}">Alquiler</option>
                <option value="Venta" th:selected="${tipo == 'Venta'}">Venta</option>
                <option value="Servicio" th:selected="${tipo == 'Servicio'}">Servicio</option>
            </select>
        </div>
        <div class="filter-group">
            <i class="ti ti-toggle-left"></i>
            <select name="activo">
                <option value="">Todos</option>
                <option value="true" th:selected="${activo == true}">Activos</option>
                <option value="false" th:selected="${activo == false}">Inactivos</option>
            </select>
        </div>
        <button type="submit" class="btn-secondary">
            <i class="ti ti-search"></i> Filtrar
        </button>
        <a th:href="@{/admin/productos}" class="btn-secondary" th:if="${search != null or categoriaId != null or tipo != null or activo != null}">
            <i class="ti ti-refresh"></i> Limpiar
        </a>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Tipo</th>
                    <th>Precio Base</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.idProducto}">—</td>
                    <td>
                        <strong th:text="${producto.nombreItem}">—</strong>
                        <span style="display:block; font-size:11px; color:var(--text-3);" 
                              th:text="'PROD-' + ${#strings.leftPad(producto.idProducto, 5, '0')}">PROD-00000</span>
                    </td>
                    <td>
                        <span th:text="${producto.nombreCategoria != null ? producto.nombreCategoria : 'Sin categoría'}">—</span>
                    </td>
                    <td>
                        <span class="badge-tipo" 
                              th:classappend="${producto.tipo == 'Alquiler'} ? 'badge-alquiler' : 
                                              (producto.tipo == 'Venta' ? 'badge-venta' : 'badge-servicio')"
                              th:text="${producto.tipo}">Alquiler</span>
                    </td>
                    <td>
                        <strong th:text="${producto.precioBaseFormateado != null ? producto.precioBaseFormateado : 'S/ 0.00'}">S/ 0.00</strong>
                    </td>
                    <td>
                        <span class="badge-estado" 
                              th:classappend="${producto.activo} ? 'badge-activo' : 'badge-inactivo'"
                              th:text="${producto.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td class="action-buttons">
                        <a th:href="@{/admin/productos/detalle/{id}(id=${producto.idProducto})}" class="btn-icon">
                            <i class="ti ti-eye"></i> Ver
                        </a>
                        <a th:href="@{/admin/productos/editar/{id}(id=${producto.idProducto})}" class="btn-icon azul">
                            <i class="ti ti-edit"></i> Editar
                        </a>
                        <form th:action="@{/admin/productos/activar/{id}(id=${producto.idProducto})}" method="post" style="display:inline;" 
                              th:if="${!producto.activo}">
                            <button type="submit" class="btn-icon verde" onclick="return confirm('¿Activar este producto?');">
                                <i class="ti ti-check"></i> Activar
                            </button>
                        </form>
                        <form th:action="@{/admin/productos/desactivar/{id}(id=${producto.idProducto})}" method="post" style="display:inline;" 
                              th:if="${producto.activo}">
                            <button type="submit" class="btn-icon rojo" 
                                    onclick="return confirm('¿Desactivar este producto?');">
                                <i class="ti ti-x"></i> Desactivar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${productos == null or #lists.isEmpty(productos)}">
                    <td colspan="7">
                        <div class="empty-message">
                            <i class="ti ti-package-off"></i>
                            <p>No hay productos registrados.</p>
                            <a th:href="@{/admin/productos/nuevo}" class="btn-primary" style="margin-top: 16px;">
                                <i class="ti ti-plus"></i> Crear primer producto
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${productos != null and !#lists.isEmpty(productos)}">
        <div class="pagination-info">
            Mostrando <span th:text="${#lists.size(productos)}">0</span> de <span th:text="${totalItems != null ? totalItems : 0}">0</span> productos
        </div>
        <div class="pagination-buttons">
            <a th:href="@{/admin/productos(page=${currentPage != null ? currentPage - 1 : 0}, search=${search}, categoriaId=${categoriaId}, tipo=${tipo}, activo=${activo})}" 
               class="page-link" 
               th:classappend="${currentPage == null or currentPage == 0} ? 'disabled' : ''">
                Anterior
            </a>
            <a th:each="i : ${#numbers.sequence(0, totalPages != null ? totalPages - 1 : 0)}" 
               th:href="@{/admin/productos(page=${i}, search=${search}, categoriaId=${categoriaId}, tipo=${tipo}, activo=${activo})}" 
               class="page-link" 
               th:classappend="${i == currentPage} ? 'active' : ''"
               th:text="${i + 1}">
                1
            </a>
            <a th:href="@{/admin/productos(page=${currentPage != null ? currentPage + 1 : 1}, search=${search}, categoriaId=${categoriaId}, tipo=${tipo}, activo=${activo})}" 
               class="page-link" 
               th:classappend="${currentPage == null or currentPage == totalPages - 1} ? 'disabled' : ''">
                Siguiente
            </a>
        </div>
    </div>

</div>

</body>
</html>

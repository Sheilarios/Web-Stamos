<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAMOS · Detalle de Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); padding: 40px 24px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); border-radius: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
        .page-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .page-title i { color: var(--yellow-dark); font-size: 28px; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-2); padding: 8px 16px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary:hover { border-color: var(--yellow); color: var(--yellow-dark); }
        .info-card { background: var(--yellow-light); border: 1px solid var(--yellow-border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .info-row { display: flex; margin-bottom: 16px; }
        .info-label { width: 140px; font-weight: 600; color: var(--yellow-dark); }
        .info-value { flex: 1; color: var(--text); }
        .image-preview { text-align: center; margin-bottom: 24px; }
        .image-preview img { max-width: 100%; max-height: 200px; border-radius: 12px; border: 1px solid var(--border); }
        .action-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .btn-primary { background: var(--yellow); border: none; color: #2A1800; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--yellow-mid); }
        @media (max-width: 640px) { .info-row { flex-direction: column; margin-bottom: 12px; } .info-label { width: auto; margin-bottom: 4px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="page-title">
            <i class="ti ti-package"></i>
            <span th:text="${producto.nombre}">Detalle del producto</span>
        </div>
        <a th:href="@{/admin/productos}" class="btn-secondary"><i class="ti ti-arrow-left"></i> Volver al listado</a>
    </div>

    <div th:if="${producto.urlImagen != null}" class="image-preview">
        <img th:src="${producto.urlImagen}" alt="Imagen del producto">
    </div>

    <div class="info-card">
        <div class="info-row">
            <div class="info-label">ID:</div>
            <div class="info-value" th:text="${producto.id}">—</div>
        </div>
        <div class="info-row">
            <div class="info-label">Nombre:</div>
            <div class="info-value" th:text="${producto.nombre}">—</div>
        </div>
        <div class="info-row">
            <div class="info-label">Descripción:</div>
            <div class="info-value" th:text="${producto.descripcion != null ? producto.descripcion : 'Sin descripción'}">—</div>
        </div>
        <div class="info-row">
            <div class="info-label">Precio base:</div>
            <div class="info-value" th:text="'S/ ' + ${producto.precioBase}">—</div>
        </div>
        <div class="info-row">
            <div class="info-label">Categoría:</div>
            <div class="info-value" th:text="${producto.categoria != null ? producto.categoria : 'No especificada'}">—</div>
        </div>
        <div class="info-row">
            <div class="info-label">Tipo:</div>
            <div class="info-value" th:text="${producto.tipo != null ? producto.tipo : 'No especificado'}">—</div>
        </div>
        <div class="info-row">
            <div class="info-label">Imagen URL:</div>
            <div class="info-value" th:text="${producto.urlImagen != null ? producto.urlImagen : 'No disponible'}">—</div>
        </div>
    </div>

    <div class="action-buttons">
        <a th:href="@{/admin/productos/editar/{id}(id=${producto.id})}" class="btn-primary">
            <i class="ti ti-edit"></i> Editar producto
        </a>
        <form th:action="@{/admin/productos/eliminar/{id}(id=${producto.id})}" method="post" style="display: inline;">
            <button type="submit" class="btn-primary" style="background: var(--red); color: white;" onclick="return confirm('¿Eliminar este producto permanentemente?');">
                <i class="ti ti-trash"></i> Eliminar
            </button>
        </form>
    </div>
</div>

</body>
</html>

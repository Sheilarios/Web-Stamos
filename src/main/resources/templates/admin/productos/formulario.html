<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloFormulario} + ' · STAMOS Productos'">STAMOS · Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
        
        :root {
            --yellow: #F5C400;
            --yellow-light: #FFFBE6;
            --yellow-mid: #FFE566;
            --yellow-dark: #9A7500;
            --border: #E2E6EA;
            --bg: #F5F6F8;
            --card: #FFFFFF;
            --text: #1A1F2E;
            --text-2: #5A6478;
            --text-3: #9BA5B7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); padding: 40px 24px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); border-radius: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 32px; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .header i { font-size: 28px; color: var(--yellow-dark); }
        .header h1 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-2); margin-bottom: 6px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 16px; }
        input, select, textarea { width: 100%; padding: 12px 12px 12px 42px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; background: white; }
        input:focus, select:focus, textarea:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(245,196,0,0.15); }
        textarea { padding: 12px; resize: vertical; min-height: 80px; }
        input[type="file"] { padding: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
        .btn-primary { background: var(--yellow); border: none; color: #2A1800; padding: 10px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--yellow-mid); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-2); padding: 10px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary:hover { border-color: var(--yellow); color: var(--yellow-dark); }
        @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; gap: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="ti ti-package"></i>
        <h1 th:text="${tituloFormulario}">Formulario Producto</h1>
    </div>

    <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        
        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <div class="input-wrapper"><i class="ti ti-tag"></i><input type="text" id="nombre" th:field="*{nombre}" required></div>
        </div>
        
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <div class="input-wrapper"><i class="ti ti-article"></i><textarea id="descripcion" th:field="*{descripcion}" rows="2"></textarea></div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="precioBase">Precio base (S/) *</label>
                <div class="input-wrapper"><i class="ti ti-coin"></i><input type="number" id="precioBase" th:field="*{precioBase}" step="0.01" min="0" required></div>
            </div>
            <div class="form-group">
                <label for="tipo">Tipo</label>
                <div class="input-wrapper"><i class="ti ti-category"></i>
                    <select id="tipo" th:field="*{tipo}">
                        <option value="">Seleccionar</option>
                        <option value="VENTA">Venta</option>
                        <option value="ALQUILER">Alquiler</option>
                        <option value="AMBOS">Ambos</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="categoria">Categoría</label>
            <div class="input-wrapper"><i class="ti ti-layout-grid"></i>
                <select id="categoria" th:field="*{categoria}">
                    <option value="">Seleccionar categoría</option>
                    <option value="Stands y estructuras feriales">Stands y estructuras feriales</option>
                    <option value="Mobiliario para eventos">Mobiliario para eventos</option>
                    <option value="Equipamiento interactivo y audiovisual">Equipamiento interactivo</option>
                    <option value="Publicidad gráfica">Publicidad gráfica</option>
                    <option value="Servicios">Servicios</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="urlImagen">Imagen (URL o subir archivo)</label>
            <div class="input-wrapper"><i class="ti ti-photo"></i><input type="text" id="urlImagen" th:field="*{urlImagen}" placeholder="https://... o ruta"></div>
            <div style="margin-top: 8px;"><input type="file" name="imagen" accept="image/*"></div>
            <div style="font-size: 11px; color: var(--text-3); margin-top: 4px;">Opcional: puede ingresar una URL o subir una imagen.</div>
        </div>
        
        <div class="form-actions">
            <a th:href="@{/admin/productos}" class="btn-secondary"><i class="ti ti-arrow-left"></i> Cancelar</a>
            <button type="submit" class="btn-primary"><i class="ti ti-device-floppy"></i> <span th:text="${textoBoton}">Guardar</span></button>
        </div>
    </form>
</div>

</body>
</html>
